<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMYSC - Quick Links</title>
    <link rel="icon" type="image/png" href="../assets/images/logo_1.png">

    <!-- External Admin CSS -->
    <link rel="stylesheet" href="../assets/css/admin-style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#121212',
                        surface: '#1E1E1E',
                        'surface-container': '#252529',
                        'surface-bright': '#3b3b3f',
                        primary: '#a6f7bd',
                        'on-primary': '#003915',
                        secondary: '#c2c9bd',
                        tertiary: '#a0cfd0',
                        error: '#ffb4ab',
                        outline: '#8e918f'
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">


</head>

<body class="bg-[#121212] text-slate-100 min-h-screen font-sans overflow-hidden">

    <div id="overlay" onclick="toggleSidebar()"
        class="fixed inset-0 bg-black/60 z-40 hidden md:hidden backdrop-blur-sm"></div>

    <div class="flex h-screen relative">
        <aside id="sidebar"
            class="fixed inset-y-0 left-0 w-[300px] m3-drawer flex flex-col z-50 sidebar-closed md:relative md:translate-x-0 shadow-xl md:shadow-none pr-3">
            <div class="p-6 pl-8 flex items-center justify-between h-20">
                <div class="flex items-center gap-3">
                    <img src="../assets/images/logo.png" class="h-8 w-8 object-contain">
                    <div>
                        <h2 class="font-display font-bold text-lg text-[#E3E3E3] tracking-tight">Admin<span
                                class="text-primary">Panel</span></h2>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-[#C4C7C5] hover:text-white"><span
                        class="material-symbols-rounded">close</span></button>
            </div>

            <nav class="flex-1 px-3 space-y-1 mt-2 overflow-y-auto custom-scrollbar">
                <a href="index.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">dashboard</span> Dashboard
                </a>
                <a href="members.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">group</span> Members
                </a>
                <a href="events.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">event</span> Events
                </a>
                <a href="sports.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">emoji_events</span> Sports
                </a>
                <a href="notifications.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">notifications</span> Notifications
                </a>
                <a href="#" class="m3-nav-item active flex items-center gap-4 px-6 py-3.5 text-sm font-medium">
                    <span class="material-symbols-rounded text-[20px]">link</span> Quick Links
                </a>
                <a href="committee.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">diversity_3</span> Committee
                </a>
                <a href="payment.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">payments</span> Payments
                </a>
                <a href="about.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">info</span> About Info
                </a>
                <a href="settings.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">settings</span> Page Settings
                </a>
            </nav>
            <div class="p-6 border-t border-[#353539]">
                <button onclick="logout()"
                    class="w-full flex items-center justify-center gap-2 px-6 py-3 bg-[#3c2525] text-[#ffb4ab] hover:bg-[#533535] hover:text-white rounded-full transition duration-300 font-medium text-sm">
                    <span class="material-symbols-rounded text-[20px]">logout</span> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto relative bg-[#121212] scroll-smooth">

            <button onclick="toggleSidebar()"
                class="md:hidden absolute top-6 right-6 z-40 bg-[#1E1E1E] p-2 rounded-full text-[#E3E3E3] border border-white/10 shadow-lg"><span
                    class="material-symbols-rounded text-2xl">menu</span></button>

            <!-- M3 Header Section -->
            <div class="relative px-6 md:px-12 pt-12 pb-8">
                <div class="flex items-end justify-between" data-aos="fade-up">
                    <div>
                        <h1
                            class="text-3xl md:text-5xl font-display font-medium text-[#E3E3E3] flex items-center gap-3">
                            <span class="material-symbols-rounded text-4xl md:text-5xl text-primary">link</span> Quick
                            Links
                        </h1>
                        <p class="text-[#c2c9bd] text-sm font-medium mt-2 opacity-90 tracking-wide uppercase">Manage
                            External Resources</p>
                    </div>
                </div>
            </div>

            <div class="px-6 md:px-12 pb-12">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                    <div class="lg:col-span-1">
                        <div class="m3-card p-6 bg-[#1E1E1E] border border-white/5 sticky top-8" data-aos="fade-up">
                            <h3 class="text-xl font-display font-medium text-[#E3E3E3] mb-6 flex items-center gap-2">
                                <span class="bg-primary/10 text-primary p-2 rounded-full"><span
                                        class="material-symbols-rounded">add</span></span> New Link
                            </h3>
                            <form id="linkForm" class="space-y-4">
                                <div><label
                                        class="text-xs font-bold uppercase text-[#8e918f] mb-1 block">Title</label><input
                                        type="text" id="title" class="w-full m3-input p-3 text-[#E3E3E3]" required>
                                </div>
                                <div><label
                                        class="text-xs font-bold uppercase text-[#8e918f] mb-1 block">URL</label><input
                                        type="text" id="url" class="w-full m3-input p-3 text-[#E3E3E3]" required></div>
                                <div><label class="text-xs font-bold uppercase text-[#8e918f] mb-1 block">Icon
                                        URL</label><input type="text" id="img"
                                        class="w-full m3-input p-3 text-[#E3E3E3]"></div>
                                <div>
                                    <label class="text-xs font-bold uppercase text-[#8e918f] mb-1 block">Display
                                        Type</label>
                                    <select id="type" class="w-full m3-input p-3 text-[#E3E3E3]"
                                        onchange="toggleDates()">
                                        <option value="always">Always Show</option>
                                        <option value="scheduled">Scheduled</option>
                                    </select>
                                </div>
                                <div id="dates" class="hidden space-y-2 border-l-2 border-primary pl-3">
                                    <div><label
                                            class="text-[10px] font-bold uppercase text-[#8e918f] mb-1 block">Start</label><input
                                            type="date" id="start" class="w-full m3-input p-3 text-[#E3E3E3]"></div>
                                    <div><label
                                            class="text-[10px] font-bold uppercase text-[#8e918f] mb-1 block">End</label><input
                                            type="date" id="end" class="w-full m3-input p-3 text-[#E3E3E3]"></div>
                                </div>
                                <button type="submit"
                                    class="w-full bg-[#003915] hover:bg-[#004d1b] text-[#a6f7bd] font-bold py-3.5 rounded-full shadow-lg transition border border-[#a6f7bd]/20">Add
                                    Link</button>
                            </form>
                        </div>
                    </div>

                    <div class="lg:col-span-2">
                        <div class="m3-card p-6 bg-[#1E1E1E] border border-white/5" data-aos="fade-up"
                            data-aos-delay="100">
                            <h3 class="text-sm font-bold text-[#8e918f] uppercase mb-4 tracking-widest">Current Links
                            </h3>
                            <div id="linkList" class="space-y-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../js/supabase.js"></script>
    <script>
        AOS.init();

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('sidebar-closed');
            sidebar.classList.toggle('sidebar-open');
            overlay.classList.toggle('hidden');
        }

        async function logout() {
            if (confirm("Are you sure you want to logout?")) {
                if (typeof _supabase !== 'undefined') {
                    await _supabase.auth.signOut();
                }
                window.location.href = '../up and in/login.html';
            }
        }

        function toggleDates() { document.getElementById('dates').classList.toggle('hidden', document.getElementById('type').value === 'always'); }

        async function loadLinks() {
            if (typeof _supabase === 'undefined') {
                console.error("Supabase not loaded.");
                return;
            }

            // Check auth first
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.href = '../up and in/login.html';

            const { data } = await _supabase.from('quick_links').select('*');
            document.getElementById('linkList').innerHTML = data.map(l => `
                <div class="bg-[#252529] p-4 rounded-xl flex justify-between items-center border border-white/5 shadow-sm group hover:bg-[#303036] transition">
                    <div class="flex items-center gap-4">
                        ${l.image_url ? `<img src="${l.image_url}" class="w-12 h-12 rounded-lg object-cover">` : '<div class="w-12 h-12 rounded-lg bg-[#1E1E1E] flex items-center justify-center"><span class="material-symbols-rounded text-xl text-[#8e918f]">link</span></div>'}
                        <div>
                            <h4 class="font-display font-medium text-[#E3E3E3]">${l.title}</h4>
                            <p class="text-xs text-primary font-mono truncate w-48 md:w-64 opacity-90">${l.url}</p>
                            ${l.display_type === 'scheduled' ? `<span class="text-[10px] bg-tertiary/20 text-tertiary px-2 py-0.5 rounded-full font-bold mt-1 inline-block">Scheduled</span>` : ''}
                        </div>
                    </div>
                    <button onclick="delLink('${l.id}')" class="text-[#8e918f] hover:text-error p-2 rounded-full transition"><span class="material-symbols-rounded text-xl">delete</span></button>
                </div>`).join('');
        }

        document.getElementById('linkForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            await _supabase.from('quick_links').insert({
                title: document.getElementById('title').value,
                url: document.getElementById('url').value,
                image_url: document.getElementById('img').value,
                display_type: document.getElementById('type').value,
                start_date: document.getElementById('type').value === 'scheduled' ? document.getElementById('start').value : null,
                end_date: document.getElementById('type').value === 'scheduled' ? document.getElementById('end').value : null
            });
            e.target.reset(); loadLinks();
        });

        async function delLink(id) {
            if (confirm("Are you sure you want to delete this link?")) {
                await _supabase.from('quick_links').delete().eq('id', id);
                loadLinks();
            }
        }
        loadLinks();
    </script>
</body>

</html>
