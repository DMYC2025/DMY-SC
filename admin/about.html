<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMYSC - About Info</title>
    <link rel="icon" type="image/png" href="../assets/images/logo_1.png">

    <!-- External Admin CSS -->
    <link rel="stylesheet" href="../assets/css/admin-style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#121212',
                        surface: '#1E1E1E',
                        'surface-container': '#252529',
                        'surface-bright': '#3b3b3f',
                        primary: '#a8c7fa',
                        'on-primary': '#062e6f',
                        secondary: '#c2c9bd',
                        tertiary: '#a0cfd0',
                        error: '#ffb4ab',
                        outline: '#8e918f'
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">


</head>

<body class="bg-[#121212] text-slate-100 min-h-screen font-sans overflow-hidden">

    <div id="overlay" onclick="toggleSidebar()"
        class="fixed inset-0 bg-black/60 z-40 hidden md:hidden backdrop-blur-sm"></div>

    <div class="flex h-screen relative">
        <aside id="sidebar"
            class="fixed inset-y-0 left-0 w-[300px] m3-drawer flex flex-col z-50 sidebar-closed md:relative md:translate-x-0 shadow-xl md:shadow-none pr-3">
            <div class="p-6 pl-8 flex items-center justify-between h-20">
                <div class="flex items-center gap-3">
                    <img src="../assets/images/logo.png" class="h-8 w-8 object-contain">
                    <div>
                        <h2 class="font-display font-bold text-lg text-[#E3E3E3] tracking-tight">Admin<span
                                class="text-primary">Panel</span></h2>
                    </div>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-[#C4C7C5] hover:text-white"><span
                        class="material-symbols-rounded">close</span></button>
            </div>

            <nav class="flex-1 px-3 space-y-1 mt-2 overflow-y-auto custom-scrollbar">
                <a href="index.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">dashboard</span> Dashboard
                </a>
                <a href="members.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">group</span> Members
                </a>
                <a href="events.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">event</span> Events
                </a>
                <a href="sports.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">emoji_events</span> Sports
                </a>
                <a href="notifications.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">notifications</span> Notifications
                </a>
                <a href="issues.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">report_problem</span> Support Issues
                </a>
                <a href="quick_links.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">link</span> Quick Links
                </a>
                <a href="committee.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">diversity_3</span> Committee
                </a>
                <a href="payment.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">payments</span> Payments
                </a>
                <a href="#" class="m3-nav-item active flex items-center gap-4 px-6 py-3.5 text-sm font-medium">
                    <span class="material-symbols-rounded text-[20px]">info</span> About Info
                </a>
                <a href="settings.html"
                    class="m3-nav-item flex items-center gap-4 px-6 py-3.5 text-sm font-medium text-[#C4C7C5]">
                    <span class="material-symbols-rounded text-[20px]">settings</span> Page Settings
                </a>
            </nav>
            <div class="p-6 border-t border-[#353539]">
                <button onclick="logout()"
                    class="w-full flex items-center justify-center gap-2 px-6 py-3 bg-[#3c2525] text-[#ffb4ab] hover:bg-[#533535] hover:text-white rounded-full transition duration-300 font-medium text-sm">
                    <span class="material-symbols-rounded text-[20px]">logout</span> Logout
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto relative bg-[#121212] scroll-smooth">

            <button onclick="toggleSidebar()"
                class="md:hidden absolute top-6 right-6 z-40 bg-[#1E1E1E] p-2 rounded-full text-[#E3E3E3] border border-white/10 shadow-lg"><span
                    class="material-symbols-rounded text-2xl">menu</span></button>

            <!-- M3 Header Section -->
            <div class="relative px-6 md:px-12 pt-12 pb-8">
                <div class="flex items-end justify-between" data-aos="fade-up">
                    <div>
                        <h1
                            class="text-3xl md:text-5xl font-display font-medium text-[#E3E3E3] flex items-center gap-3">
                            <span class="material-symbols-rounded text-4xl md:text-5xl text-primary">info</span> About
                            Info
                        </h1>
                        <p class="text-[#c2c9bd] text-sm font-medium mt-2 opacity-90 tracking-wide uppercase">Vision,
                            Mission & Constitution</p>
                    </div>
                </div>
            </div>

            <div class="max-w-5xl mx-auto px-6 md:px-12 pb-12">
                <div class="m3-card p-8 bg-[#1E1E1E] border border-white/5 rounded-xl shadow-xl" data-aos="fade-up">
                    <form id="aboutForm" class="space-y-6">
                        <div>
                            <label
                                class="text-xs font-bold text-tertiary uppercase mb-2 block tracking-wider">Vision</label>
                            <textarea id="vision" rows="3" class="w-full m3-input p-4 font-medium text-[#E3E3E3]"
                                placeholder="Enter Club Vision..."></textarea>
                        </div>
                        <div>
                            <label
                                class="text-xs font-bold text-tertiary uppercase mb-2 block tracking-wider">Mission</label>
                            <textarea id="mission" rows="3" class="w-full m3-input p-4 font-medium text-[#E3E3E3]"
                                placeholder="Enter Club Mission..."></textarea>
                        </div>
                        <div class="border-t border-white/5 pt-6">
                            <label
                                class="text-xs font-bold text-tertiary uppercase mb-2 block tracking-wider">Constitution</label>
                            <input type="text" id="constLink" placeholder="PDF Link (Optional)"
                                class="w-full m3-input p-3 mb-4 text-sm text-[#E3E3E3]">
                            <textarea id="constText" rows="10" placeholder="Full Text of Constitution..."
                                class="w-full m3-input p-4 font-mono text-sm text-[#E3E3E3]"></textarea>
                        </div>
                        <button type="submit"
                            class="bg-[#062e6f] hover:bg-[#0b4ec7] text-[#a8c7fa] font-bold py-3.5 px-8 rounded-full shadow-lg transition flex items-center gap-2 border border-[#a8c7fa]/20">
                            <span class="material-symbols-rounded">save</span> Update Info
                        </button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/supabase.js"></script>
    <script>
        AOS.init();

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('overlay');
            sidebar.classList.toggle('sidebar-closed');
            sidebar.classList.toggle('sidebar-open');
            overlay.classList.toggle('hidden');
        }

        async function logout() {
            if (confirm("Are you sure you want to logout?")) {
                try {
                    if (typeof _supabase !== 'undefined') await _supabase.auth.signOut();
                } catch (error) {
                    console.error("Logout Error:", error);
                }
                window.location.href = '../up and in/login.html';
            }
        }

        async function init() {
            if (typeof _supabase === 'undefined') {
                console.error("Supabase not loaded.");
                return;
            }
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return window.location.href = '../up and in/login.html';
            load();
        }

        async function load() {
            const { data } = await _supabase.from('about_info').select('*').single();
            if (data) {
                document.getElementById('vision').value = data.vision || '';
                document.getElementById('mission').value = data.mission || '';
                document.getElementById('constLink').value = data.constitution_link || '';
                document.getElementById('constText').value = data.constitution_text || '';
            }
        }

        document.getElementById('aboutForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const { error } = await _supabase.from('about_info').upsert({
                id: 1,
                vision: document.getElementById('vision').value,
                mission: document.getElementById('mission').value,
                constitution_link: document.getElementById('constLink').value,
                constitution_text: document.getElementById('constText').value
            });
            if (error) alert(error.message); else alert('Updated Successfully!');
        });

        init();
    </script>
</body>

</html>
