<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password - DMYSC</title>
    <link rel="icon" type="image/png" href="../assets/images/logo_1.png">

    <!-- External Auth CSS -->
    <link rel="stylesheet" href="../assets/css/auth-style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#121212',
                        surface: '#1E1E1E',
                        'surface-container': '#252529',
                        primary: '#a6f7bd',
                        'on-primary': '#003915',
                        secondary: '#c2c9bd',
                        error: '#ffb4ab',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body
    class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-500 no-tap-highlight">

    <div
        class="absolute top-0 left-0 w-96 h-96 bg-primary opacity-5 rounded-full blur-[80px] animate-pulse pointer-events-none">
    </div>
    <div
        class="absolute bottom-0 right-0 w-96 h-96 bg-secondary opacity-5 rounded-full blur-[80px] animate-pulse pointer-events-none">
    </div>

    <div
        class="bg-[#1E1E1E] border border-white/5 shadow-2xl rounded-[32px] w-full max-w-sm overflow-hidden relative z-10 transform transition-all">

        <div class="h-28 bg-[#252529] p-8 flex items-end relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
            <div class="relative z-10">
                <h2 class="text-2xl font-display font-bold text-[#E3E3E3] leading-none">Reset Password</h2>
                <p class="text-primary text-xs font-bold mt-1 uppercase tracking-wide">Secure Account Recovery</p>
            </div>
            <span
                class="material-symbols-rounded absolute top-6 right-6 text-4xl text-[#E3E3E3] opacity-20">lock_reset</span>
        </div>

        <div class="p-8">
            <form id="resetRequestForm" class="space-y-6">
                <p class="text-xs text-[#8e918f] font-medium leading-relaxed">
                    Enter your email to receive a password reset link.<br>
                    <span class="text-[10px] opacity-70">ඔබගේ ඊමේල් ලිපිනය ඇතුලත් කරන්න. අප ඔබට පාස්වර්ඩ් වෙනස් කිරීමේ
                        ලින්ක් එකක් එවන්නෙමු.</span>
                </p>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-[#8e918f] uppercase tracking-wider ml-1">Email</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-rounded absolute left-4 top-1/2 -translate-y-1/2 text-[#8e918f] group-focus-within:text-primary transition">mail</span>
                        <input type="email" id="email" required
                            class="w-full pl-11 pr-4 py-3 rounded-2xl bg-[#252529] border border-[#353539] focus:border-primary outline-none text-[#E3E3E3] transition font-medium text-sm placeholder-[#444746] shadow-sm"
                            placeholder="you@example.com">
                    </div>
                </div>

                <button type="submit" id="sendLinkBtn"
                    class="w-full bg-primary text-[#003915] py-4 rounded-full font-bold text-sm shadow-lg shadow-primary/20 hover:bg-[#b1fcc5] active:scale-[0.98] transition transform flex justify-center items-center gap-2 mt-4">
                    <span class="material-symbols-rounded">send</span> Send Reset Link
                </button>
            </form>

            <form id="updatePassForm" class="space-y-6 hidden">
                <p class="text-xs text-[#8e918f] font-medium leading-relaxed">
                    Enter your new password below.<br>
                    <span class="text-[10px] opacity-70">ඔබගේ නව මුරපදය පහතින් ඇතුලත් කරන්න.</span>
                </p>

                <div class="space-y-1">
                    <label class="text-[10px] font-bold text-[#8e918f] uppercase tracking-wider ml-1">New
                        Password</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-rounded absolute left-4 top-1/2 -translate-y-1/2 text-[#8e918f] group-focus-within:text-primary transition">lock</span>
                        <input type="password" id="newPassword" required minlength="6"
                            class="w-full pl-11 pr-4 py-3 rounded-2xl bg-[#252529] border border-[#353539] focus:border-primary outline-none text-[#E3E3E3] transition font-medium text-sm placeholder-[#444746] shadow-sm"
                            placeholder="New Password">
                    </div>
                </div>

                <button type="submit" id="updateBtn"
                    class="w-full bg-primary text-[#003915] py-4 rounded-full font-bold text-sm shadow-lg shadow-primary/20 hover:bg-[#b1fcc5] active:scale-[0.98] transition transform flex justify-center items-center gap-2 mt-4">
                    <span class="material-symbols-rounded">save</span> Update Password
                </button>
            </form>

            <p id="resetStatusMsg" class="text-center text-[10px] font-bold mt-4 hidden whitespace-pre-line"></p>

            <div class="mt-8 text-center pt-4 border-t border-white/5">
                <a href="login.html"
                    class="inline-flex items-center gap-1 text-[10px] font-bold text-[#8e918f] hover:text-primary transition uppercase tracking-wider">
                    <span class="material-symbols-rounded text-sm">arrow_back</span> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script>
        document.documentElement.classList.add('dark');

        const resetRequestForm = document.getElementById('resetRequestForm');
        const updatePassForm = document.getElementById('updatePassForm');
        const sendLinkBtn = document.getElementById('sendLinkBtn');
        const updateBtn = document.getElementById('updateBtn');
        const statusMsg = document.getElementById('resetStatusMsg');

        // Check if user clicked the email link (Supabase adds #access_token to URL)
        // Or if the user is already logged in securely via the magic link
        _supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === "PASSWORD_RECOVERY") {
                // User clicked the email link
                resetRequestForm.classList.add('hidden');
                updatePassForm.classList.remove('hidden');
                statusMsg.textContent = "";
            }
        });

        // 1. Send Reset Link Logic
        resetRequestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            sendLinkBtn.disabled = true;
            sendLinkBtn.innerHTML = '<span class="material-symbols-rounded animate-spin">progress_activity</span> Sending...';
            statusMsg.className = "hidden";

            try {
                // Determine the URL to redirect back to (current page)
                const redirectUrl = window.location.href;

                const { data, error } = await _supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: redirectUrl,
                });

                if (error) throw error;

                statusMsg.textContent = "Reset link sent! Check your email.\nපාස්වර්ඩ් වෙනස් කිරීමේ ලින්ක් එක ඊමේල් කර ඇත.";
                statusMsg.className = "text-center text-[10px] font-bold mt-4 text-primary block";

            } catch (error) {
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.className = "text-center text-[10px] font-bold mt-4 text-error block";
            } finally {
                sendLinkBtn.disabled = false;
                sendLinkBtn.innerHTML = '<span class="material-symbols-rounded">send</span> Send Reset Link';
            }
        });

        // 2. Update Password Logic
        updatePassForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;

            updateBtn.disabled = true;
            updateBtn.innerHTML = '<span class="material-symbols-rounded animate-spin">progress_activity</span> Updating...';

            try {
                const { data, error } = await _supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                statusMsg.textContent = "Password updated successfully!\nමුරපදය යාවත්කාලීන කිරීම සාර්ථකයි!";
                statusMsg.className = "text-center text-[10px] font-bold mt-4 text-primary block";

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.className = "text-center text-[10px] font-bold mt-4 text-error block";
                updateBtn.disabled = false;
                updateBtn.innerHTML = '<span class="material-symbols-rounded">save</span> Update Password';
            }
        });
    </script>
</body>

</html>
