<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sports - DMYSC</title>
    <link rel="icon" type="image/png" href="../assets/images/logo_1.png">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- MATERIAL SYMBOLS -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#121212',
                        surface: '#1E1E1E',
                        'surface-container': '#252529',
                        primary: '#a6f7bd',
                        'on-primary': '#003915',
                        secondary: '#c2c9bd',
                        tertiary: '#a0cfd0',
                        error: '#ffb4ab',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    },
                    borderRadius: {
                        '4xl': '28px',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.2, 0.0, 0, 1.0)',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <link rel="stylesheet" href="../assets/css/user-style.css">
</head>

<body class="min-h-screen pb-24 md:pb-0 font-sans">

    <!-- Top Navigation (Desktop) -->
    <nav class="sticky top-4 z-40 w-full px-4 no-print">
        <div class="max-w-7xl mx-auto m3-navbar px-4 py-3 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 pl-2 group">
                <button
                    class="w-8 h-8 rounded-full bg-[#353539] flex items-center justify-center group-hover:bg-primary group-hover:text-[#003915] transition">
                    <span class="material-symbols-rounded text-[20px]">arrow_back</span>
                </button>
                <div class="flex flex-col">
                    <span class="text-sm font-display font-medium text-[#E3E3E3]">Sports</span>
                    <span class="text-[10px] text-secondary tracking-wider font-bold">Teams</span>
                </div>
            </a>

            <div class="flex items-center gap-3">
                <!-- Notifications -->
                <div class="relative">
                    <button onclick="toggleNotifPopup()"
                        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#3b3b3f] transition text-[#C4C7C5] relative">
                        <span class="material-symbols-rounded">notifications</span>
                        <span id="notifBadgeDot"
                            class="hidden absolute top-2 right-2.5 w-2 h-2 bg-error rounded-full border-2 border-[#252529]"></span>
                    </button>
                    <!-- Notification Popup -->
                    <div id="notifPopup"
                        class="hidden absolute right-0 mt-2 w-[300px] md:w-[380px] bg-[#252529] rounded-[28px] shadow-2xl origin-top-right z-50 animate-scale-up border border-[#353539] overflow-hidden">
                        <div class="px-6 py-4 border-b border-[#353539] flex justify-between items-center bg-[#1E1E1E]">
                            <h3 class="text-sm font-display font-bold text-[#E3E3E3] uppercase tracking-wider">Club
                                Alerts</h3>
                            <span class="text-[10px] text-primary font-bold">Recent</span>
                        </div>
                        <div id="notifPopupList" class="max-h-[350px] overflow-y-auto custom-scrollbar p-2 space-y-2">
                            <div class="text-center py-8">
                                <span class="material-symbols-rounded animate-spin text-primary">sync</span>
                            </div>
                        </div>
                        <div class="p-3 border-t border-[#353539] bg-[#1E1E1E]">
                            <a href="notifycation.html"
                                class="flex items-center justify-center gap-2 w-full py-2 rounded-full bg-[#353539] hover:bg-primary hover:text-[#003915] text-[#E3E3E3] text-xs font-bold transition-all duration-300 group">
                                View All Notifications
                                <span
                                    class="material-symbols-rounded text-xs group-hover:translate-x-1 transition-transform">arrow_forward</span>
                            </a>
                        </div>
                    </div>
                </div>
                <!-- Profile Pop -->
                <div class="relative">
                    <button onclick="toggleProfilePopup()"
                        class="w-10 h-10 rounded-full p-1 bg-[#353539] hidden md:block border border-primary hover:scale-105 transition duration-300">
                        <img id="navAvatar"
                            src="https://img.freepik.com/premium-vector/green-user-account-profile-flat-icon-apps-websites_1254296-1186.jpg"
                            class="w-full h-full rounded-full object-cover">
                    </button>
                    <div id="profilePopup"
                        class="hidden absolute right-0 mt-2 w-72 bg-[#252529] rounded-[28px] shadow-xl p-4 origin-top-right z-50 animate-scale-up border border-[#353539]">
                        <div class="flex flex-col items-center pb-4 border-b border-[#353539] mb-2">
                            <img id="popupAvatar" src="" class="w-16 h-16 rounded-full mb-2 object-cover">
                            <h3 id="popupName" class="text-base font-display font-medium text-[#E3E3E3]">Loading...</h3>
                            <p id="popupEmail" class="text-xs text-[#C4C7C5]">...</p>
                        </div>
                        <div class="space-y-1">
                            <div
                                class="flex justify-between px-4 py-3 rounded-full hover:bg-[#353539] transition cursor-default">
                                <span class="text-xs text-[#C4C7C5]">Club ID</span><span id="popupClubId"
                                    class="text-xs font-medium text-primary">...</span>
                            </div>
                            <div
                                class="flex justify-between px-4 py-3 rounded-full hover:bg-[#353539] transition cursor-default">
                                <span class="text-xs text-[#C4C7C5]">NIC</span><span id="popupNic"
                                    class="text-xs font-medium text-[#E3E3E3]">...</span>
                            </div>
                        </div>
                        <div id="popupExecRole"
                            class="hidden mt-2 p-2 rounded-lg bg-[#3b2d1d] text-[#ffdcbe] text-center text-xs font-bold">
                        </div>
                        <div id="popupCaptainRole"
                            class="hidden mt-2 p-2 rounded-lg bg-[#1d2a3b] text-[#a0cfd0] text-center text-xs font-bold">
                        </div>

                        <a href="profile.html"
                            class="flex items-center gap-3 px-4 py-3 mt-2 rounded-full hover:bg-[#353539] transition text-sm text-[#E3E3E3]">
                            <span class="material-symbols-rounded text-[20px]">edit</span> Edit Profile
                        </a>
                        <button onclick="logout()"
                            class="w-full mt-1 flex items-center gap-3 px-4 py-3 rounded-full hover:bg-[#3c2525] text-error transition text-sm text-left">
                            <span class="material-symbols-rounded text-[20px]">logout</span> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Header Card -->
        <div class="m3-card p-6 md:p-8 relative overflow-hidden bg-[#252529]" data-aos="fade-down">
            <div class="relative z-10">
                <div class="flex items-center gap-2 text-tertiary mb-2">
                    <span class="material-symbols-rounded">emoji_events</span>
                    <span class="text-xs font-bold uppercase tracking-widest">Sports</span>
                </div>
                <h1 class="text-3xl md:text-5xl font-display font-normal text-[#E3E3E3] leading-tight">
                    Our <span class="text-tertiary">Teams</span>
                </h1>
                <p class="text-[#C4C7C5] mt-2 text-sm md:text-base max-w-xl">
                    Discover our sports teams, meet the captains, and get involved.
                </p>
            </div>
            <!-- Decorative Elements -->
            <div class="absolute top-[-20px] right-[-20px] w-64 h-64 bg-tertiary opacity-5 rounded-full blur-3xl"></div>
        </div>

        <!-- Sports Grid -->
        <div id="sportsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Loading State -->
            <div class="col-span-full py-20 text-center">
                <span class="material-symbols-rounded animate-spin text-4xl text-tertiary mb-2">sports_score</span>
                <p class="text-xs text-[#C4C7C5] uppercase tracking-widest">Loading Teams...</p>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <div id="global-footer-placeholder" class="pb-20 md:pb-0"></div>

    <!-- Mobile Bottom Nav -->
    <div class="md:hidden fixed bottom-0 left-0 w-full z-50 bg-[#1E1E1E] border-t border-[#252529] pb-safe">
        <div class="flex justify-around items-center h-16">
            <a href="index.html" class="flex flex-col items-center gap-1 w-full text-[#C4C7C5]">
                <span class="material-symbols-rounded">home</span>
                <span class="text-[10px] font-medium">Home</span>
            </a>
            <button class="flex flex-col items-center gap-1 w-full text-tertiary">
                <div class="w-12 h-7 rounded-full bg-[#003334] flex items-center justify-center">
                    <span class="material-symbols-rounded text-[20px]">emoji_events</span>
                </div>
                <span class="text-[10px] font-medium">Sports</span>
            </button>
            <a href="profile.html" class="flex flex-col items-center gap-1 w-full text-[#C4C7C5]">
                <span class="material-symbols-rounded">person</span>
                <span class="text-[10px] font-medium">Profile</span>
            </a>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script>
        AOS.init();

        // 1. Check Login
        async function checkAccess() {
            if (typeof _supabase === 'undefined') return;
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) window.location.href = '../up and in/login.html';
            else {
                loadProfilePopupData(); // Shared logic from ui.js
            }
        }


        // 2. Load Sports Logic
        async function load() {
            // Using correct join syntax for Supabase
            const { data, error } = await _supabase.from('sports').select('*, profiles:captain_id(full_name)');

            const grid = document.getElementById('sportsGrid');
            grid.innerHTML = '';

            if (error) {
                console.error(error);
                grid.innerHTML = `<div class="col-span-full text-center text-error">Error loading sports data.</div>`;
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-[#C4C7C5]">No sports teams found.</div>`;
                return;
            }

            data.forEach((s, i) => {
                const captainName = s.profiles?.full_name || 'TBA';
                const captainInitial = captainName.charAt(0).toUpperCase();

                grid.innerHTML += `
                    <div class="m3-card group overflow-hidden flex flex-col" data-aos="fade-up" data-aos-delay="${i * 100}">
                        
                        <!-- Image Header -->
                        <div class="h-48 relative bg-[#252529] overflow-hidden">
                            ${s.image_url
                        ? `<img src="${s.image_url}" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 group-hover:scale-105 transition duration-700">`
                        : `<div class="w-full h-full flex items-center justify-center"><span class="material-symbols-rounded text-6xl text-[#353539]">sports</span></div>`
                    }
                            <div class="absolute inset-0 bg-gradient-to-t from-[#1E1E1E] to-transparent"></div>
                            
                            <!-- Title Overlay -->
                            <div class="absolute bottom-4 left-6">
                                <h3 class="text-2xl font-display font-medium text-white">${s.name}</h3>
                            </div>
                        </div>
                        
                        <!-- Content Body -->
                        <div class="p-6 flex-1 flex flex-col">
                            <p class="text-[#C4C7C5] text-sm leading-relaxed mb-6 font-light line-clamp-3 flex-1">
                                ${s.description || 'Join our team today and show your skills!'}
                            </p>
                            
                            <!-- Captain Pill -->
                            <div class="bg-[#252529] p-3 rounded-2xl border border-[#353539] flex items-center gap-4 hover:bg-[#353539] transition">
                                <div class="w-10 h-10 rounded-full bg-tertiary text-[#003334] flex items-center justify-center font-bold text-lg shrink-0">
                                    ${captainInitial}
                                </div>
                                <div>
                                    <p class="text-[10px] text-tertiary uppercase font-bold tracking-widest">Captain</p>
                                    <h4 class="text-[#E3E3E3] font-medium text-sm flex items-center gap-1">
                                        ${captainName} ${typeof getVerifyIcon === 'function' ? getVerifyIcon() : ''}
                                    </h4>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        checkAccess();
        load();
    </script>
    <div id="global-footer-placeholder"></div>
    <script src="../assets/js/footer-loader.js"></script>
    <script>
        // --- Footer Script Start ---

        // 1. Footer එකේ වර්ෂය update කිරීම
        const yearElem = document.getElementById('year');
        if (yearElem) {
            yearElem.innerText = new Date().getFullYear();
        }

        // 2. Contact තොරතුරු පෙන්වීම (Simulated)
        setTimeout(() => {
            const addr = document.getElementById('footerAddress');
            const phone = document.getElementById('footerPhone');
            const email = document.getElementById('footerEmail');

            if (addr) addr.innerText = "616-B, Dikhenagama, Horana";
            if (phone) phone.innerText = "+94 77 155 7685";
            if (email) email.innerText = "dreammakersysc@gmail.com";
        }, 500);

        // 3. Popup (Modal) Open Function
        window.openModal = function (modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return; // Modal එක නැත්නම් නවතින්න

            const backdrop = modal.querySelector('.modal-backdrop');
            const panel = modal.querySelector('.modal-panel');

            modal.classList.remove('hidden');

            // Animation එක පෙනෙන්නට සුළු වේලාවක් දෙන්න
            setTimeout(() => {
                if (backdrop) backdrop.classList.remove('opacity-0');
                if (panel) {
                    panel.classList.remove('scale-95', 'opacity-0');
                    panel.classList.add('scale-100', 'opacity-100');
                }
            }, 10);
        }

        // 4. Popup (Modal) Close Function
        window.closeModal = function (modalId) {
            const modal = document.getElementById(modalId);
            if (!modal) return;

            const backdrop = modal.querySelector('.modal-backdrop');
            const panel = modal.querySelector('.modal-panel');

            if (backdrop) backdrop.classList.add('opacity-0');
            if (panel) {
                panel.classList.remove('scale-100', 'opacity-100');
                panel.classList.add('scale-95', 'opacity-0');
            }

            // Animation එක ඉවර වුනාම hide කරන්න
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 300);
        }

        // 5. Modal එකෙන් එලිය click කල විට close වීම
        document.addEventListener('click', function (event) {
            if (event.target.classList.contains('modal-backdrop')) {
                const modal = event.target.closest('[role="dialog"]');
                if (modal) closeModal(modal.id);
            }
        });

        // --- Footer Script End ---
    </script>
</body>

</html>
