<!-- Mobile Profile Menu Modal -->
<div id="mobileProfileModal"
    class="fixed inset-0 z-[100] hidden flex items-end justify-center bg-black/60 no-print backdrop-blur-sm">
    <div class="absolute inset-0" onclick="closeMobileProfileModal()"></div>
    <div
        class="bg-[#1E1E1E] w-full rounded-t-[28px] p-6 pb-10 flex flex-col gap-3 animate-fade-in border-t border-[#353539]">
        <div class="w-12 h-1 bg-[#353539] rounded-full mx-auto mb-4"></div>

        <div class="flex items-center gap-4 mb-4 pb-4 border-b border-[#353539]">
            <img id="mobileMenuAvatar" src="" class="w-14 h-14 rounded-full object-cover border border-[#353539]">
            <div>
                <h3 id="mobileMenuName" class="text-lg font-display font-medium text-[#E3E3E3]">Memebr</h3>
                <p id="mobileMenuId" class="text-xs text-primary font-mono">ID: ...</p>
            </div>
        </div>

        <a href="profile.html"
            class="w-full flex items-center gap-3 px-4 py-4 rounded-[20px] bg-[#252529] text-[#E3E3E3] font-medium text-sm hover:bg-[#353539] transition">
            <div class="w-8 h-8 rounded-full bg-[#1E1E1E] flex items-center justify-center text-[#C4C7C5]">
                <span class="material-symbols-rounded text-[20px]">person</span>
            </div>
            Account Info
            <span class="material-symbols-rounded ml-auto text-[#8e918f]">chevron_right</span>
        </a>

        <button onclick="logout()"
            class="w-full flex items-center gap-3 px-4 py-4 rounded-[20px] bg-[#3c2525] text-[#ffb4ab] font-medium text-sm hover:bg-[#533535] transition">
            <div class="w-8 h-8 rounded-full bg-[#2d1f1f] flex items-center justify-center text-[#ffb4ab]">
                <span class="material-symbols-rounded text-[20px]">logout</span>
            </div>
            Logout
        </button>

        <button onclick="closeMobileProfileModal()" class="mt-2 text-center text-xs text-[#8e918f] font-medium py-2">
            Close Menu
        </button>
    </div>
</div>

<script>
    const mobileProfileModal = document.getElementById('mobileProfileModal');

    function openMobileProfileModal() {
        // Populate data from existing loaded data
        if (currentUserData) {
            document.getElementById('mobileMenuName').innerText = currentUserData.fullName;
            document.getElementById('mobileMenuId').innerText = 'ID: ' + currentUserData.id;
            document.getElementById('mobileMenuAvatar').src = currentUserData.avatar;
        }

        mobileProfileModal.classList.remove('hidden');
    }

    function closeMobileProfileModal() {
        mobileProfileModal.classList.add('hidden');
    }
</script>
