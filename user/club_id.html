<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital ID - DMYSC</title>

    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" href="../assets/images/logo_1.png">
    <link rel="apple-touch-icon" href="../assets/images/logo_1.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#121212',
                        primary: '#a6f7bd',
                        secondary: '#a0cfd0',
                        tertiary: '#e7bdfb',
                        surface: '#1E1E1E',
                        'surface-container': '#252529',
                        error: '#ffb4ab'
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="../assets/css/user-style.css">

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('../sw.js');
            });
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4 page-id-card">

    <!-- Loading State -->
    <div id="loading" class="fixed inset-0 bg-[#121212] z-50 flex flex-col items-center justify-center">
        <div class="w-12 h-12 border-4 border-primary/20 border-t-primary rounded-full animate-spin"></div>
        <p class="text-primary font-medium mt-4 text-sm tracking-widest uppercase animate-pulse">Verifying ID...</p>
    </div>

    <!-- Error State -->
    <div id="errorBox" class="hidden glass-card p-8 w-full max-w-sm text-center">
        <div class="w-20 h-20 rounded-full bg-error/10 text-error flex items-center justify-center mx-auto mb-4">
            <span class="material-symbols-rounded text-4xl">gpp_bad</span>
        </div>
        <h2 class="text-2xl font-display font-medium text-[#E3E3E3] mb-2">Invalid ID</h2>
        <p class="text-[#C4C7C5] text-sm mb-6 font-light leading-relaxed">
            The scanned QR code is invalid or the member could not be found in our database.
        </p>
        <a href="../index.html" class="m3-btn-primary px-8 py-3 text-sm inline-block">Go Home</a>
    </div>

    <!-- Card Display -->
    <div id="cardDisplay"
        class="hidden w-full max-w-[340px] glass-card overflow-hidden transition-all duration-700 opacity-0 translate-y-8 relative group">

        <!-- Animated Background Glow -->
        <div
            class="absolute top-[-50%] left-[-50%] w-[200%] h-[200%] bg-gradient-to-tr from-transparent via-white/5 to-transparent rotate-45 animate-pulse opacity-0 group-hover:opacity-100 transition-opacity duration-1000 pointer-events-none">
        </div>

        <!-- Header Image -->
        <div class="relative h-32 bg-[#252529]">
            <img src="https://tnrqasiiywcvtwkwytqe.supabase.co/storage/v1/object/public/slides/DSC03348.jpg"
                class="w-full h-full object-cover opacity-50 mix-blend-overlay">
            <div class="absolute inset-0 bg-gradient-to-t from-[#1E1E1E] to-transparent"></div>

            <div class="absolute top-4 left-4 flex items-center gap-2">
                <img src="../assets/images/logo_2.png" class="w-8 h-8 object-contain drop-shadow-md">
                <span class="text-xs font-bold text-white/80 tracking-widest uppercase">DMYSC</span>
            </div>

            <div
                class="absolute top-4 right-4 verified-badge px-3 py-1 rounded-full flex items-center gap-1 shadow-[0_0_15px_rgba(166,247,189,0.2)]">
                <span class="material-symbols-rounded text-sm">verified</span>
                <span class="text-[10px] font-bold tracking-wider uppercase">Active</span>
            </div>
        </div>

        <!-- Profile Content -->
        <div class="px-6 -mt-16 flex flex-col items-center relative z-10">
            <div class="w-28 h-28 p-1 rounded-full border border-white/10 bg-[#1E1E1E] shadow-2xl relative">
                <div class="absolute inset-0 rounded-full border border-primary/30 animate-pulse"></div>
                <img id="profileImg" src="" class="w-full h-full rounded-full object-cover bg-[#252529]">
            </div>

            <h1 id="displayName" class="mt-4 text-2xl font-display font-medium text-white text-center">...</h1>
            <p id="fullName" class="text-xs text-[#8e918f] font-mono text-center mt-1">...</p>

            <div class="mt-4 flex flex-wrap justify-center gap-2 w-full min-h-[32px]" id="rolesContainer">
                <!-- Roles injected via JS -->
            </div>
        </div>

        <div class="h-[1px] bg-white/5 mx-6 my-6"></div>

        <!-- Meta Grid -->
        <div class="px-6 pb-6 space-y-3">
            <div class="grid grid-cols-2 gap-3 mb-2">
                <div
                    class="bg-[#252529]/50 rounded-2xl p-3 flex flex-col items-center justify-center border border-white/5">
                    <span class="text-[9px] text-[#8e918f] uppercase tracking-widest font-bold mb-1">Age</span>
                    <span id="age" class="text-lg text-[#E3E3E3] font-display">...</span>
                </div>
                <div
                    class="bg-[#252529]/50 rounded-2xl p-3 flex flex-col items-center justify-center border border-white/5">
                    <span class="text-[9px] text-[#8e918f] uppercase tracking-widest font-bold mb-1">Club ID</span>
                    <span id="memberId" class="text-lg text-primary font-mono tracking-wider">...</span>
                </div>
            </div>

            <a href="#"
                class="flex items-center gap-4 p-3 rounded-2xl bg-[#252529]/30 hover:bg-[#252529] border border-white/5 transition group/item">
                <div
                    class="w-10 h-10 rounded-full bg-[#1E1E1E] flex items-center justify-center text-[#8e918f] group-hover/item:text-white transition shadow-lg">
                    <span class="material-symbols-rounded">mail</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[10px] text-[#8e918f] uppercase tracking-wider font-bold">Email</p>
                    <p id="email" class="text-xs text-[#E3E3E3] truncate font-light">...</p>
                </div>
            </a>

            <a href="#"
                class="flex items-center gap-4 p-3 rounded-2xl bg-[#252529]/30 hover:bg-[#252529] border border-white/5 transition group/item">
                <div
                    class="w-10 h-10 rounded-full bg-[#1E1E1E] flex items-center justify-center text-[#8e918f] group-hover/item:text-white transition shadow-lg">
                    <span class="material-symbols-rounded">phone_iphone</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[10px] text-[#8e918f] uppercase tracking-wider font-bold">Phone</p>
                    <p id="phone" class="text-xs text-[#E3E3E3] font-light">...</p>
                </div>
            </a>
        </div>

        <div class="bg-[#1a1a1e] p-4 text-center border-t border-white/5">
            <div
                class="text-[9px] text-[#555a5f] uppercase tracking-widest font-bold flex items-center justify-center gap-2">
                <span class="w-1.5 h-1.5 rounded-full bg-primary animate-pulse"></span>
                Official Digital ID
            </div>
            <div id="scanTime" class="text-[9px] text-[#444] mt-1 font-mono"></div>
        </div>

    </div>

    <script src="../assets/js/supabase.js"></script>
    <script>
        // Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const queryId = urlParams.get('id');
        const DEFAULT_AVATAR = "https://img.freepik.com/premium-vector/green-user-account-profile-flat-icon-apps-websites_1254296-1186.jpg";

        document.getElementById('scanTime').innerText = `Scanned: ${new Date().toLocaleString()}`;

        function calculateAge(dob) {
            if (!dob) return 'N/A';
            const birthDate = new Date(dob);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) { age--; }
            return age;
        }

        async function fetchMemberDetails() {
            if (!queryId) { showError("No Member ID provided."); return; }

            try {
                // Fetch Profile
                const { data: profile, error } = await _supabase.from('profiles').select('*').eq('member_id', queryId).single();
                if (error || !profile) { showError("Member not found."); return; }

                // Fetch Roles
                const { data: execData } = await _supabase.from('executive_committee').select('*').eq('profile_id', profile.id).single();
                const { data: sportsData } = await _supabase.from('sports').select('name').eq('captain_id', profile.id);

                renderCard(profile, execData, sportsData);

            } catch (err) {
                console.error(err);
                showError("System error occurred.");
            }
        }

        function renderCard(profile, execData, sportsData) {
            document.getElementById('loading').classList.add('hidden');
            const card = document.getElementById('cardDisplay');
            card.classList.remove('hidden');
            // Animation Delay
            setTimeout(() => {
                card.classList.remove('opacity-0', 'translate-y-8');
            }, 100);

            document.getElementById('profileImg').src = (profile.avatar_url && profile.avatar_url.trim() !== "") ? profile.avatar_url : DEFAULT_AVATAR;
            document.getElementById('displayName').innerText = profile.display_name || profile.full_name.split(' ')[0];
            document.getElementById('fullName').innerText = profile.full_name;
            document.getElementById('age').innerText = calculateAge(profile.dob) + " Yrs";
            document.getElementById('memberId').innerText = profile.member_id;
            document.getElementById('email').innerText = profile.email || 'N/A';
            document.getElementById('phone').innerText = profile.phone || 'N/A';

            // Roles Logic
            const rolesContainer = document.getElementById('rolesContainer');
            rolesContainer.innerHTML = '';

            // Executive Tag
            if (execData) {
                rolesContainer.innerHTML += `
                    <div class="px-3 py-1 rounded-full bg-tertiary/10 text-tertiary border border-tertiary/20 flex items-center gap-1">
                        <span class="material-symbols-rounded text-sm">crown</span>
                        <span class="text-[10px] font-bold uppercase tracking-wide">${execData.term_period || 'Executive'}</span>
                    </div>`;
            }

            // Captain Tag
            if (sportsData && sportsData.length > 0) {
                sportsData.forEach(sport => {
                    rolesContainer.innerHTML += `
                        <div class="px-3 py-1 rounded-full bg-secondary/10 text-secondary border border-secondary/20 flex items-center gap-1">
                            <span class="material-symbols-rounded text-sm">star</span>
                            <span class="text-[10px] font-bold uppercase tracking-wide">${sport.name} Captain</span>
                        </div>`;
                });
            }

            // Default Member
            if (!execData && (!sportsData || sportsData.length === 0)) {
                rolesContainer.innerHTML += `
                    <div class="px-3 py-1 rounded-full bg-primary/10 text-primary border border-primary/20 flex items-center gap-1">
                        <span class="material-symbols-rounded text-sm">diversity_3</span>
                        <span class="text-[10px] font-bold uppercase tracking-wide">Member</span>
                    </div>`;
            }
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('errorBox').classList.remove('hidden');
            console.log(msg);
        }

        // Disable Context Menu (Right Click)
        document.addEventListener('contextmenu', event => event.preventDefault());

        // Disable Keyboard Shortcuts for Save (Ctrl+S, Ctrl+P)
        document.addEventListener('keydown', e => {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p')) {
                e.preventDefault();
            }
        });

        fetchMemberDetails();
    </script>
</body>

</html>
