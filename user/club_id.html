<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Member Verification - DMYSC</title>
    <link rel="icon" type="image/png" href="../assets/logo_1.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { 
                        // Material 3 Dark Color Tokens
                        background: '#141218',
                        surface: '#1D1B20',
                        'surface-container': '#211F26',
                        'surface-container-high': '#2B2930',
                        primary: '#D0BCFF', // Using a light purple/blue for M3 feel or Green based on club
                        'primary-container': '#4F378B',
                        'on-primary': '#381E72',
                        'on-primary-container': '#EADDFF',
                        
                        // Custom Club Green mapped to M3
                        'club-primary': '#a6f7bd', 
                        'club-on-primary': '#003915',
                        'club-container': '#005324',
                        'club-on-container': '#c3fccf',
                        
                        outline: '#938F99',
                        'on-surface': '#E6E1E5',
                        'on-surface-variant': '#CAC4D0',
                        error: '#F2B8B5',
                        'error-container': '#8C1D18'
                    },
                    fontFamily: {
                        roboto: ['Roboto', 'sans-serif']
                    }
                } 
            } 
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        body { 
            background-color: #141218; 
            font-family: 'Roboto', sans-serif;
        }
        
        /* Material 3 Card Elevation */
        .m3-card {
            background-color: #1D1B20;
            border-radius: 24px;
            box-shadow: 0px 1px 2px rgba(0, 0, 0, 0.3), 0px 1px 3px 1px rgba(0, 0, 0, 0.15);
        }

        /* Material Ripple Simulation */
        .ripple {
            position: relative;
            overflow: hidden;
        }
        .ripple:after {
            content: "";
            display: block;
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            background-image: radial-gradient(circle, #fff 10%, transparent 10.01%);
            background-repeat: no-repeat;
            background-position: 50%;
            transform: scale(10, 10);
            opacity: 0;
            transition: transform .5s, opacity 1s;
        }
        .ripple:active:after {
            transform: scale(0, 0);
            opacity: .1;
            transition: 0s;
        }
    </style>
</head>
<body class="min-h-screen text-[#E6E1E5] flex items-center justify-center p-4">

    <div id="loading" class="fixed inset-0 bg-[#141218] z-50 flex flex-col items-center justify-center">
        <div class="relative w-12 h-12">
            <svg class="animate-spin w-full h-full text-club-primary" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
        <p class="text-club-primary font-medium mt-4 text-sm tracking-wide">Verifying Identity...</p>
    </div>

    <div id="errorBox" class="hidden w-full max-w-sm m3-card p-6 text-center">
        <span class="material-symbols-rounded text-6xl text-error mb-4">error</span>
        <h2 class="text-2xl font-normal text-[#E6E1E5] mb-2">Member Not Found</h2>
        <p class="text-[#CAC4D0] text-sm mb-6 leading-relaxed">The scanned QR code is invalid or the member does not exist in our database.</p>
        <a href="../index.html" class="inline-flex h-10 items-center justify-center rounded-full bg-club-primary px-6 text-sm font-medium text-club-on-primary hover:bg-[#b1fcc5] transition ripple">
            Go Home
        </a>
    </div>

    <div id="cardDisplay" class="hidden w-full max-w-[360px] m3-card overflow-hidden transition-all duration-500 opacity-0 translate-y-4">
        
        <div class="relative h-28 bg-[#2B2930]">
            <img src="https://tnrqasiiywcvtwkwytqe.supabase.co/storage/v1/object/public/slides/DSC03348.jpg" class="w-full h-full object-cover opacity-60">
            <div class="absolute inset-0 bg-gradient-to-t from-[#1D1B20] to-transparent"></div>
            
            <div class="absolute top-4 right-4 bg-club-container text-club-on-container px-3 py-1 rounded-lg flex items-center gap-1 shadow-sm">
                <span class="material-symbols-rounded text-base">verified</span>
                <span class="text-[11px] font-bold tracking-wide uppercase">Verified</span>
            </div>
        </div>

        <div class="px-4 -mt-12 flex flex-col items-center relative z-10">
            <img id="profileImg" src="" class="w-24 h-24 rounded-full object-cover border-[3px] border-[#1D1B20] bg-[#2B2930] shadow-md">
            
            <h1 id="displayName" class="mt-3 text-2xl font-normal text-[#E6E1E5] text-center">...</h1>
            <p id="fullName" class="text-xs text-[#CAC4D0] font-medium text-center tracking-wide">...</p>

            <div class="mt-4 flex flex-wrap justify-center gap-2 w-full" id="rolesContainer">
                </div>
        </div>

        <div class="h-[1px] bg-outline/20 mx-4 my-4"></div>

        <div class="px-4 pb-6 space-y-2">
            
            <div class="grid grid-cols-2 gap-2 mb-2">
                <div class="bg-[#2B2930] rounded-xl p-3 flex flex-col items-center justify-center">
                    <span class="text-[10px] text-[#CAC4D0] uppercase tracking-wider font-medium">Age</span>
                    <span id="age" class="text-base text-[#E6E1E5] font-medium">...</span>
                </div>
                <div class="bg-[#2B2930] rounded-xl p-3 flex flex-col items-center justify-center">
                    <span class="text-[10px] text-[#CAC4D0] uppercase tracking-wider font-medium">Member ID</span>
                    <span id="memberId" class="text-base text-club-primary font-mono font-medium">...</span>
                </div>
            </div>

            <div class="flex items-center gap-4 p-2 rounded-lg hover:bg-[#2B2930]/50 transition">
                <div class="w-10 h-10 rounded-full bg-[#3A4B3F] flex items-center justify-center text-club-primary">
                    <span class="material-symbols-rounded">mail</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[11px] text-[#CAC4D0] font-medium">Email Address</p>
                    <p id="email" class="text-sm text-[#E6E1E5] truncate">...</p>
                </div>
            </div>

            <div class="flex items-center gap-4 p-2 rounded-lg hover:bg-[#2B2930]/50 transition">
                <div class="w-10 h-10 rounded-full bg-[#3F3A4B] flex items-center justify-center text-[#D0BCFF]">
                    <span class="material-symbols-rounded">call</span>
                </div>
                <div class="flex-1 min-w-0">
                    <p class="text-[11px] text-[#CAC4D0] font-medium">Phone Number</p>
                    <p id="phone" class="text-sm text-[#E6E1E5]">...</p>
                </div>
            </div>

        </div>

        <div class="bg-[#2B2930] p-3 text-center border-t border-outline/10">
            <p class="text-[10px] text-[#CAC4D0]">
                Dream Makers Youth & Sports Club<br>
                <span id="scanTime" class="opacity-60"></span>
            </p>
        </div>
    </div>

    <script src="../js/supabase.js"></script>
    <script>
        // Get ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const queryId = urlParams.get('id');
        const DEFAULT_AVATAR = "https://img.freepik.com/premium-vector/green-user-account-profile-flat-icon-apps-websites_1254296-1186.jpg";

        document.getElementById('scanTime').innerText = `Verified: ${new Date().toLocaleString()}`;

        // Helper to calculate age
        function calculateAge(dob) {
            if (!dob) return 'N/A';
            const birthDate = new Date(dob);
            const today = new Date();
            let age = today.getFullYear() - birthDate.getFullYear();
            const m = today.getMonth() - birthDate.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) {
                age--;
            }
            return age;
        }

        async function fetchMemberDetails() {
            if (!queryId) {
                showError("No Member ID provided.");
                return;
            }

            try {
                // 1. Fetch Profile
                const { data: profile, error } = await _supabase
                    .from('profiles')
                    .select('*')
                    .eq('member_id', queryId)
                    .single();

                if (error || !profile) {
                    showError("Member not found.");
                    return;
                }

                // 2. Fetch Executive Role
                const { data: execData } = await _supabase
                    .from('executive_committee')
                    .select('*')
                    .eq('profile_id', profile.id)
                    .single();

                // 3. Fetch Sports Captaincy
                const { data: sportsData } = await _supabase
                    .from('sports')
                    .select('name')
                    .eq('captain_id', profile.id);

                renderCard(profile, execData, sportsData);

            } catch (err) {
                console.error(err);
                showError("System error occurred.");
            }
        }

        function renderCard(profile, execData, sportsData) {
            document.getElementById('loading').classList.add('hidden');
            const card = document.getElementById('cardDisplay');
            card.classList.remove('hidden');
            // Allow DOM paint then animate
            setTimeout(() => {
                card.classList.remove('opacity-0', 'translate-y-4');
            }, 10);

            // Basic Info
            document.getElementById('profileImg').src = profile.avatar_url || DEFAULT_AVATAR;
            document.getElementById('displayName').innerText = profile.display_name || profile.full_name.split(' ')[0];
            document.getElementById('fullName').innerText = profile.full_name;
            document.getElementById('age').innerText = calculateAge(profile.dob) + " Yrs";
            document.getElementById('memberId').innerText = profile.member_id;
            document.getElementById('email').innerText = profile.email || 'N/A';
            document.getElementById('phone').innerText = profile.phone || 'N/A';

            // Roles Logic (Material Chips)
            const rolesContainer = document.getElementById('rolesContainer');
            rolesContainer.innerHTML = '';

            // 1. Executive Role (Gold/Tertiary Color)
            if (execData) {
                const chip = document.createElement('div');
                chip.className = "inline-flex items-center h-8 px-3 rounded-lg bg-[#4A4458] text-[#E8DEF8] border border-[#625B71]";
                chip.innerHTML = `
                    <span class="material-symbols-rounded text-lg mr-1.5 text-[#FFD8E4]">crown</span>
                    <span class="text-xs font-medium tracking-wide">${execData.term_period || 'Executive'}</span>
                `; 
                rolesContainer.appendChild(chip);
            }

            // 2. Captain Roles (Blue/Secondary Color)
            if (sportsData && sportsData.length > 0) {
                sportsData.forEach(sport => {
                    const chip = document.createElement('div');
                    chip.className = "inline-flex items-center h-8 px-3 rounded-lg bg-[#3F3A4B] text-[#D0BCFF] border border-[#4F378B]";
                    chip.innerHTML = `
                        <span class="material-symbols-rounded text-lg mr-1.5">star</span>
                        <span class="text-xs font-medium tracking-wide">${sport.name} Captain</span>
                    `;
                    rolesContainer.appendChild(chip);
                });
            }

            // 3. Default Member Tag (Green/Primary Color)
            if (!execData && (!sportsData || sportsData.length === 0)) {
                const chip = document.createElement('div');
                chip.className = "inline-flex items-center h-8 px-3 rounded-lg bg-club-container text-club-on-container border border-club-primary/30";
                chip.innerHTML = `
                    <span class="material-symbols-rounded text-lg mr-1.5">groups</span>
                    <span class="text-xs font-medium tracking-wide">Club Member</span>
                `;
                rolesContainer.appendChild(chip);
            }
        }

        function showError(msg) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('errorBox').classList.remove('hidden');
            console.log(msg);
        }

        // Start
        fetchMemberDetails();
    </script>
</body>
</html>
