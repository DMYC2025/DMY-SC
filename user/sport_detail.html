<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sport Details - DMYSC</title>
    <link rel="icon" type="image/png" href="../assets/images/logo_1.png">

    <!-- GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <!-- MATERIAL SYMBOLS -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#121212',
                        surface: '#1E1E1E',
                        'surface-container': '#252529',
                        primary: '#a6f7bd',
                        'on-primary': '#003915',
                        secondary: '#c2c9bd',
                        tertiary: '#a0cfd0',
                        error: '#ffb4ab',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    },
                    borderRadius: {
                        '4xl': '28px',
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.4s cubic-bezier(0.2, 0.0, 0, 1.0)',
                    },
                    keyframes: {
                        fadeIn: { '0%': { opacity: '0', transform: 'translateY(10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
                    }
                }
            }
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            background-color: #121212;
            color: #E3E3E3;
            -webkit-tap-highlight-color: transparent;
        }

        .m3-card {
            background-color: #1E1E1E;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .m3-navbar {
            background-color: #252529;
            border-radius: 999px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        }

        .gallery-scroll {
            scroll-snap-type: x mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .gallery-item {
            scroll-snap-align: center;
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>

<body class="min-h-screen pb-24 md:pb-0 font-sans">

    <!-- Top Navigation (Desktop) -->
    <nav class="sticky top-4 z-40 w-full px-4 no-print">
        <div class="max-w-7xl mx-auto m3-navbar px-4 py-3 flex justify-between items-center">
            <a href="sport.html" class="flex items-center gap-3 pl-2 group">
                <button
                    class="w-8 h-8 rounded-full bg-[#353539] flex items-center justify-center group-hover:bg-primary group-hover:text-[#003915] transition">
                    <span class="material-symbols-rounded text-[20px]">arrow_back</span>
                </button>
                <div class="flex flex-col">
                    <span class="text-sm font-display font-medium text-[#E3E3E3]">Teams</span>
                    <span class="text-[10px] text-secondary tracking-wider font-bold">Details</span>
                </div>
            </a>

            <!-- Right Side Actions (Same as other pages) -->
            <div class="flex items-center gap-3">
                <!-- Notifications -->
                <div class="relative">
                    <button onclick="toggleNotifPopup()"
                        class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-[#3b3b3f] transition text-[#C4C7C5] relative">
                        <span class="material-symbols-rounded">notifications</span>
                        <span id="notifBadgeDot"
                            class="hidden absolute top-2 right-2.5 w-2 h-2 bg-error rounded-full border-2 border-[#252529]"></span>
                    </button>
                    <!-- Popup Placeholder (Logic in ui.js) -->
                    <div id="notifPopup"
                        class="hidden absolute right-0 mt-2 w-[300px] md:w-[380px] bg-[#252529] rounded-[28px] shadow-2xl origin-top-right z-50 animate-scale-up border border-[#353539] overflow-hidden">
                        <div class="px-6 py-4 border-b border-[#353539] flex justify-between items-center bg-[#1E1E1E]">
                            <h3 class="text-sm font-display font-bold text-[#E3E3E3] uppercase tracking-wider">Club
                                Alerts</h3>
                        </div>
                        <div id="notifPopupList" class="max-h-[350px] overflow-y-auto custom-scrollbar p-2 space-y-2">
                        </div>
                        <div class="p-3 border-t border-[#353539] bg-[#1E1E1E]">
                            <a href="notifycation.html"
                                class="flex items-center justify-center gap-2 w-full py-2 rounded-full bg-[#353539] hover:bg-primary hover:text-[#003915] text-[#E3E3E3] text-xs font-bold transition-all duration-300">View
                                All</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Loading State -->
        <div id="loadingState" class="col-span-full py-40 text-center">
            <span class="material-symbols-rounded animate-spin text-4xl text-tertiary mb-2">sports_score</span>
            <p class="text-xs text-[#C4C7C5] uppercase tracking-widest">Loading Details...</p>
        </div>

        <div id="contentContainer" class="hidden space-y-8">

            <!-- Hero Section -->
            <div class="relative rounded-[32px] overflow-hidden h-64 md:h-80 border border-white/5 shadow-2xl">
                <img id="sportImage" src="" class="w-full h-full object-cover opacity-60">
                <div class="absolute inset-0 bg-gradient-to-t from-[#121212] via-[#121212]/50 to-transparent"></div>

                <div class="absolute bottom-6 left-6 md:left-10 right-6 z-10">
                    <div class="flex flex-col md:flex-row md:items-end justify-between gap-4">
                        <div>
                            <span
                                class="bg-tertiary/20 text-tertiary px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider backdrop-blur-md border border-tertiary/20 mb-3 inline-block">Official
                                Team</span>
                            <h1 id="sportName"
                                class="text-4xl md:text-6xl font-display font-bold text-white mb-2 leading-tight"></h1>
                            <p id="sportDesc"
                                class="text-[#C4C7C5] text-sm md:text-base max-w-2xl font-light leading-relaxed line-clamp-2 md:line-clamp-none">
                            </p>
                        </div>

                        <!-- Captain Card (Floating) -->
                        <div
                            class="bg-[#252529]/80 backdrop-blur-xl p-4 rounded-2xl border border-white/10 flex items-center gap-4 min-w-[200px]">
                            <div class="w-12 h-12 rounded-full bg-primary/20 p-0.5 border border-primary/30">
                                <span
                                    class="w-full h-full rounded-full bg-primary text-[#003915] flex items-center justify-center font-bold text-lg"
                                    id="captInitials"></span>
                            </div>
                            <div>
                                <p class="text-[10px] text-primary uppercase font-bold tracking-widest mb-0.5">Team
                                    Captain</p>
                                <h3 id="captainName" class="text-white font-medium text-sm"></h3>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Tabs Navigation -->
            <div
                class="flex overflow-x-auto no-scrollbar gap-2 border-b border-white/5 pb-1 sticky top-20 z-30 bg-[#121212]/95 backdrop-blur-sm pt-2">
                <button onclick="switchTab('gallery')" id="tab-gallery"
                    class="px-6 py-2.5 rounded-full text-sm font-medium transition whitespace-nowrap bg-[#252529] text-white border border-white/10 shadow-lg">Gallery
                    & Highlights</button>
                <button onclick="switchTab('roster')" id="tab-roster"
                    class="px-6 py-2.5 rounded-full text-sm font-medium transition whitespace-nowrap text-[#8e918f] hover:text-white">Team
                    Roster</button>
                <button onclick="switchTab('achiev')" id="tab-achiev"
                    class="px-6 py-2.5 rounded-full text-sm font-medium transition whitespace-nowrap text-[#8e918f] hover:text-white">Achievements</button>
            </div>

            <!-- Tab Contents -->

            <!-- 1. Gallery Tab -->
            <div id="content-gallery" class="space-y-6 animate-fade-in">
                <div class="flex justify-between items-center px-2">
                    <h3 class="text-lg font-display font-medium text-[#E3E3E3]">Photo Gallery</h3>
                    <div class="flex gap-2">
                        <button onclick="scrollGallery(-1)"
                            class="w-8 h-8 rounded-full bg-[#252529] flex items-center justify-center hover:bg-[#353539] text-[#C4C7C5]"><span
                                class="material-symbols-rounded">chevron_left</span></button>
                        <button onclick="scrollGallery(1)"
                            class="w-8 h-8 rounded-full bg-[#252529] flex items-center justify-center hover:bg-[#353539] text-[#C4C7C5]"><span
                                class="material-symbols-rounded">chevron_right</span></button>
                    </div>
                </div>

                <div id="galleryContainer" class="flex gap-4 overflow-x-auto gallery-scroll pb-4 no-scrollbar">
                    <!-- Gallery Items Injected Here -->
                    <div
                        class="w-full h-48 md:h-64 flex items-center justify-center text-[#8e918f] italic bg-[#1E1E1E] rounded-2xl border border-white/5 gallery-item shrink-0 w-[90vw] md:w-[60vw]">
                        No photos available yet.
                    </div>
                </div>
            </div>

            <!-- 2. Roster Tab -->
            <div id="content-roster" class="hidden animate-fade-in">
                <h3 class="text-lg font-display font-medium text-[#E3E3E3] mb-4 px-2">Team Members</h3>
                <div id="rosterGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    <!-- Members Injected Here -->
                </div>
            </div>

            <!-- 3. Achievements Tab -->
            <div id="content-achiev" class="hidden animate-fade-in">
                <h3 class="text-lg font-display font-medium text-[#E3E3E3] mb-4 px-2">Team History & Wins</h3>
                <div class="relative border-l border-white/10 ml-3 space-y-8 pb-4" id="achievTimeline">
                    <!-- Timeline Items Injected Here -->
                </div>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <div id="global-footer-placeholder"></div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/maintenance-check.js"></script>
    <script src="../assets/js/ui.js"></script>
    <script>
        AOS.init();

        const urlParams = new URLSearchParams(window.location.search);
        const sportId = urlParams.get('id');

        async function init() {
            if (!sportId) {
                window.location.href = 'sport.html';
                return;
            }

            // Load Sport Details
            const { data: sport, error } = await _supabase.from('sports').select('*, profiles:captain_id(full_name)').eq('id', sportId).single();

            if (error || !sport) {
                document.getElementById('loadingState').innerHTML = '<p class="text-error">Sport not found.</p>';
                return;
            }

            // Populate Header
            document.getElementById('sportName').innerText = sport.name;
            document.getElementById('sportDesc').innerText = sport.description || '';
            document.getElementById('sportImage').src = sport.image_url || 'https://via.placeholder.com/800x400';

            const capName = sport.profiles?.full_name || 'TBA';
            document.getElementById('captainName').innerText = capName;
            document.getElementById('captInitials').innerText = capName.charAt(0).toUpperCase();

            // Load Related Data Parallelly
            await Promise.all([
                loadGallery(),
                loadRoster(),
                loadAchievements()
            ]);

            document.getElementById('loadingState').classList.add('hidden');
            document.getElementById('contentContainer').classList.remove('hidden');
        }

        async function loadGallery() {
            const { data } = await _supabase.from('sport_gallery').select('*').eq('sport_id', sportId);
            const container = document.getElementById('galleryContainer');

            if (data && data.length > 0) {
                container.innerHTML = '';
                data.forEach(img => {
                    container.innerHTML += `
                        <div class="gallery-item shrink-0 w-[85vw] md:w-[500px] h-48 md:h-[300px] rounded-2xl overflow-hidden relative group border border-white/5">
                            <img src="${img.image_url}" class="w-full h-full object-cover">
                        </div>
                    `;
                });
            }
        }

        async function loadRoster() {
            const { data } = await _supabase.from('sport_team_members').select('*, profiles:profile_id(full_name, avatar_url)').eq('sport_id', sportId);
            const grid = document.getElementById('rosterGrid');

            if (data && data.length > 0) {
                grid.innerHTML = '';
                data.forEach(m => {
                    const avatar = m.profiles?.avatar_url || 'https://img.freepik.com/premium-vector/green-user-account-profile-flat-icon-apps-websites_1254296-1186.jpg';
                    grid.innerHTML += `
                        <div class="bg-[#252529] p-4 rounded-2xl border border-white/5 flex flex-col items-center text-center hover:bg-[#353539] transition">
                            <img src="${avatar}" class="w-16 h-16 rounded-full mb-3 object-cover border-2 border-[#1E1E1E]">
                            <h4 class="text-[#E3E3E3] font-bold text-sm leading-tight mb-1">${m.profiles?.full_name}</h4>
                            <span class="text-[10px] text-primary bg-primary/10 px-2 py-0.5 rounded-full uppercase font-bold tracking-wider">${m.role || 'Member'}</span>
                        </div>
                    `;
                });
            } else {
                grid.innerHTML = '<p class="col-span-full text-center text-[#8e918f] py-4">Roster not yet announced.</p>';
            }
        }

        async function loadAchievements() {
            const { data } = await _supabase.from('sport_achievements').select('*').eq('sport_id', sportId).order('achievement_date', { ascending: false });
            const tl = document.getElementById('achievTimeline');

            if (data && data.length > 0) {
                tl.innerHTML = '';
                data.forEach(a => {
                    let colorClass = 'bg-[#353539] text-[#C4C7C5]'; // Participation
                    if (a.result_type === 'Win') colorClass = 'bg-primary text-[#003915]';
                    if (a.result_type === 'Runner-up') colorClass = 'bg-yellow-500/20 text-yellow-200';
                    if (a.result_type === 'Loss') colorClass = 'bg-red-500/10 text-red-300';

                    tl.innerHTML += `
                        <div class="relative pl-6">
                            <div class="absolute -left-[5px] top-1.5 w-2.5 h-2.5 rounded-full bg-tertiary shadow-[0_0_10px_rgba(160,207,208,0.5)]"></div>
                            <div class="bg-[#252529] p-4 rounded-2xl border border-white/5">
                                <div class="flex justify-between items-start mb-2">
                                    <h4 class="text-[#E3E3E3] font-bold">${a.title}</h4>
                                    <span class="px-2 py-0.5 text-[10px] font-bold uppercase tracking-wider rounded-md ${colorClass}">${a.result_type}</span>
                                </div>
                                <p class="text-xs text-[#8e918f] font-mono mb-2">${new Date(a.achievement_date).toLocaleDateString()}</p>
                            </div>
                        </div>
                    `;
                });
            } else {
                tl.innerHTML = '<p class="text-[#8e918f] italic pl-6">No recent achievements recorded.</p>';
            }
        }

        function switchTab(tab) {
            // Reset UI
            ['gallery', 'roster', 'achiev'].forEach(t => {
                document.getElementById('tab-' + t).classList.replace('text-white', 'text-[#8e918f]');
                document.getElementById('tab-' + t).classList.replace('bg-[#252529]', 'bg-transparent');
                document.getElementById('tab-' + t).classList.remove('border', 'border-white/10', 'shadow-lg');
                document.getElementById('content-' + t).classList.add('hidden');
            });

            // Activate Target
            const activeBtn = document.getElementById('tab-' + tab);
            activeBtn.classList.replace('text-[#8e918f]', 'text-white');
            activeBtn.classList.replace('bg-transparent', 'bg-[#252529]');
            activeBtn.classList.add('border', 'border-white/10', 'shadow-lg');

            document.getElementById('content-' + tab).classList.remove('hidden');
        }

        function scrollGallery(dir) {
            const c = document.getElementById('galleryContainer');
            c.scrollBy({ left: dir * 300, behavior: 'smooth' });
        }

        loadProfilePopupData(); // Shared ui.js logic
        init();
    </script>
    <script src="../assets/js/footer-loader.js"></script>
</body>

</html>
