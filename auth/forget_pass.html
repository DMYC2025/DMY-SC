<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reset Password - DMYSC</title>
    <link rel="icon" type="image/png" href="../assets/images/logo_1.png">

    <!-- External Auth CSS -->
    <link rel="stylesheet" href="../assets/css/auth-style.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#0a150f',
                        surface: '#1E1E1E',
                        'surface-container': '#252529',
                        primary: '#1ED760',
                        'on-primary': '#003915',
                        secondary: '#c2c9bd',
                        error: '#ffb4ab',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        /* Modern Liquid Glass Effect overrides from index.html */
        body {
            /* Background image to make the glass effect visible and match the template vibe */
            background-image: url('https://images.unsplash.com/photo-1550147760-44c9966d6bc7?q=80&w=2000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        /* Dark overlay for better text readability */
        .body-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 21, 15, 0.45);
            backdrop-filter: blur(4px);
            z-index: -1;
        }

        .liquid-glass {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(24px) !important;
            -webkit-backdrop-filter: blur(24px) !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.05) !important;
        }

        /* Desktop: Floating animation for background blobs */
        .animate-float-bg {
            animation: floatDesktop 8s ease-in-out infinite;
        }

        .animate-float-bg-delayed {
            animation: floatDesktop 8s ease-in-out 4s infinite;
        }

        @keyframes floatDesktop {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -30px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
   </head>

<body
    class="text-[#E3E3E3] selection:bg-primary selection:text-[#003915] min-h-screen flex items-center justify-center p-4 relative overflow-hidden transition-colors duration-500 no-tap-highlight">

    <div class="body-overlay"></div>

    <div
        class="absolute top-0 left-0 w-96 h-96 bg-primary opacity-5 rounded-full blur-[80px] animate-float-bg pointer-events-none z-[-1]">
    </div>
    <div
        class="absolute bottom-0 right-0 w-96 h-96 bg-secondary opacity-5 rounded-full blur-[80px] animate-float-bg-delayed pointer-events-none z-[-1]">
    </div>

    <!-- Glass Container -->
    <!-- Mobile: Full width, stacked (w-full max-w-[90%]) -->
    <!-- PC (1920x1080): Fixed width centered (md:w-[480px] md:max-w-none) -->
    <div class="liquid-glass relative z-10 w-full max-w-[90%] md:w-[480px] md:max-w-none rounded-[32px] overflow-hidden transform transition-all hover:shadow-[0_8px_32px_0_rgba(166,247,189,0.1)]"
        data-aos="zoom-in" data-aos-duration="800">

        <!-- PC: Glow effects -->
        <div
            class="absolute -top-20 -left-20 w-40 h-40 bg-primary/20 rounded-full blur-[60px] pointer-events-none hidden md:block">
        </div>
        <div
            class="absolute -bottom-20 -right-20 w-40 h-40 bg-secondary/20 rounded-full blur-[60px] pointer-events-none hidden md:block">
        </div>

        <div
            class="h-28 md:h-32 bg-gradient-to-br from-white/5 to-transparent p-6 md:p-8 flex items-end relative overflow-hidden border-b border-white/5">
            <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
            <div class="relative z-10">
                <h2 class="text-2xl md:text-3xl font-display font-bold text-[#E3E3E3] leading-none drop-shadow-md">Reset
                    Password</h2>
                <p class="text-primary text-xs md:text-sm font-bold mt-1 uppercase tracking-wide drop-shadow-sm">Secure
                    Account Recovery</p>
            </div>
            <span
                class="material-symbols-rounded absolute top-6 right-6 text-4xl text-[#E3E3E3] opacity-50 drop-shadow-lg">lock_reset</span>
        </div>

        <div class="p-6 md:p-8">
            <form id="resetRequestForm" class="space-y-6">
                <p data-aos="fade-up" data-aos-delay="200"
                    class="text-xs text-[#C4C7C5] font-medium leading-relaxed bg-black/20 p-3 rounded-xl border border-white/5 backdrop-blur-sm">
                    Enter your email to receive a password reset link.<br>
                    <span class="text-[10px] opacity-70 block mt-1">ඔබගේ ඊමේල් ලිපිනය ඇතුලත් කරන්න. අප ඔබට පාස්වර්ඩ්
                        වෙනස් කිරීමේ
                        ලින්ක් එකක් එවන්නෙමු.</span>
                </p>

                <div class="space-y-1" data-aos="fade-up" data-aos-delay="300">
                    <label class="text-[10px] font-bold text-[#8e918f] uppercase tracking-wider ml-1">Email</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-rounded absolute left-4 top-1/2 -translate-y-1/2 text-[#8e918f] group-focus-within:text-primary transition">mail</span>
                        <input type="email" id="email" required
                            class="w-full pl-11 pr-4 py-3 rounded-2xl bg-black/20 border border-white/10 focus:border-primary/50 focus:bg-black/40 outline-none text-[#E3E3E3] transition-all font-medium text-sm placeholder-white/20 shadow-inner backdrop-blur-sm group-hover:border-white/20"
                            placeholder="you@example.com">
                    </div>
                </div>

                <button type="submit" id="sendLinkBtn" data-aos="zoom-in" data-aos-delay="400"
                    class="w-full bg-primary text-[#003915] py-4 rounded-full font-bold text-sm shadow-lg shadow-primary/20 hover:bg-[#b1fcc5] active:scale-[0.98] transition transform flex justify-center items-center gap-2 mt-4 uppercase tracking-wider hover:shadow-[0_0_20px_rgba(166,247,189,0.4)]">
                    <span class="material-symbols-rounded">send</span> Send Reset Link
                </button>
            </form>

            <form id="updatePassForm" class="space-y-6 hidden">
                <p data-aos="fade-up" data-aos-delay="200"
                    class="text-xs text-[#C4C7C5] font-medium leading-relaxed bg-black/20 p-3 rounded-xl border border-white/5 backdrop-blur-sm">
                    Enter your new password below.<br>
                    <span class="text-[10px] opacity-70 block mt-1">ඔබගේ නව මුරපදය පහතින් ඇතුලත් කරන්න.</span>
                </p>

                <div class="space-y-1" data-aos="fade-up" data-aos-delay="300">
                    <label class="text-[10px] font-bold text-[#8e918f] uppercase tracking-wider ml-1">New
                        Password</label>
                    <div class="relative group">
                        <span
                            class="material-symbols-rounded absolute left-4 top-1/2 -translate-y-1/2 text-[#8e918f] group-focus-within:text-primary transition">lock</span>
                        <input type="password" id="newPassword" required minlength="6"
                            class="w-full pl-11 pr-4 py-3 rounded-2xl bg-black/20 border border-white/10 focus:border-primary/50 focus:bg-black/40 outline-none text-[#E3E3E3] transition-all font-medium text-sm placeholder-white/20 shadow-inner backdrop-blur-sm group-hover:border-white/20"
                            placeholder="New Password">
                    </div>
                </div>

                <button type="submit" id="updateBtn" data-aos="zoom-in" data-aos-delay="400"
                    class="w-full bg-primary text-[#003915] py-4 rounded-full font-bold text-sm shadow-lg shadow-primary/20 hover:bg-[#b1fcc5] active:scale-[0.98] transition transform flex justify-center items-center gap-2 mt-4 uppercase tracking-wider hover:shadow-[0_0_20px_rgba(166,247,189,0.4)]">
                    <span class="material-symbols-rounded">save</span> Update Password
                </button>
            </form>

            <p id="resetStatusMsg" class="text-center text-[10px] font-bold mt-4 hidden whitespace-pre-line"></p>

            <div class="mt-8 text-center pt-4 border-t border-white/5" data-aos="fade-in" data-aos-delay="500">
                <a href="login.html"
                    class="inline-flex items-center gap-1 text-[10px] font-bold text-[#8e918f] hover:text-primary transition uppercase tracking-wider">
                    <span class="material-symbols-rounded text-sm">arrow_back</span> Back to Login
                </a>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="../assets/js/supabase.js"></script>
    <script src="../assets/js/maintenance-check.js"></script>
    <script>
        AOS.init({ once: true });

        document.documentElement.classList.add('dark');

        const resetRequestForm = document.getElementById('resetRequestForm');
        const updatePassForm = document.getElementById('updatePassForm');
        const sendLinkBtn = document.getElementById('sendLinkBtn');
        const updateBtn = document.getElementById('updateBtn');
        const statusMsg = document.getElementById('resetStatusMsg');

        // Check if user clicked the email link (Supabase adds #access_token to URL)
        // Or if the user is already logged in securely via the magic link
        _supabase.auth.onAuthStateChange(async (event, session) => {
            if (event === "PASSWORD_RECOVERY") {
                // User clicked the email link
                resetRequestForm.classList.add('hidden');
                updatePassForm.classList.remove('hidden');
                statusMsg.textContent = "";
            }
        });

        // 1. Send Reset Link Logic
        resetRequestForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            sendLinkBtn.disabled = true;
            sendLinkBtn.innerHTML = '<span class="material-symbols-rounded animate-spin">progress_activity</span> Sending...';
            statusMsg.className = "hidden";

            try {
                // Determine the URL to redirect back to (current page)
                const redirectUrl = window.location.href;

                const { data, error } = await _supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: redirectUrl,
                });

                if (error) throw error;

                statusMsg.textContent = "Reset link sent! Check your email.\nපාස්වර්ඩ් වෙනස් කිරීමේ ලින්ක් එක ඊමේල් කර ඇත.";
                statusMsg.className = "text-center text-[10px] font-bold mt-4 text-primary block";

            } catch (error) {
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.className = "text-center text-[10px] font-bold mt-4 text-error block";
            } finally {
                sendLinkBtn.disabled = false;
                sendLinkBtn.innerHTML = '<span class="material-symbols-rounded">send</span> Send Reset Link';
            }
        });

        // 2. Update Password Logic
        updatePassForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;

            updateBtn.disabled = true;
            updateBtn.innerHTML = '<span class="material-symbols-rounded animate-spin">progress_activity</span> Updating...';

            try {
                const { data, error } = await _supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                statusMsg.textContent = "Password updated successfully!\nමුරපදය යාවත්කාලීන කිරීම සාර්ථකයි!";
                statusMsg.className = "text-center text-[10px] font-bold mt-4 text-primary block";

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                statusMsg.textContent = "Error: " + error.message;
                statusMsg.className = "text-center text-[10px] font-bold mt-4 text-error block";
                updateBtn.disabled = false;
                updateBtn.innerHTML = '<span class="material-symbols-rounded">save</span> Update Password';
            }
        });
    </script>
</body>

</html>
