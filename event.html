<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <title>Events - DMYSC</title>
    <link rel="icon" type="image/png" href="../assets/logo_1.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { brand: { green: '#16a34a', dark: '#0b1121' } }, 
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] } 
                } 
            } 
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
    
    <style>
        .glass-card {
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        .cal-day { 
            width: 36px; height: 36px; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            border-radius: 12px; font-size: 12px; margin: auto; 
            color: #94a3b8; font-weight: 600; position: relative;
            transition: all 0.2s; cursor: pointer;
        }
        .cal-day:hover { background-color: rgba(255,255,255,0.1); color: white; }
        
        /* Today */
        .cal-day.today { background-color: #16a34a; color: white; font-weight: 800; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.4); }
        
        /* Holiday */
        .cal-day.holiday { color: #facc15; font-weight: 700; }
        .cal-day.holiday::after { content: ''; position: absolute; bottom: 3px; width: 4px; height: 4px; background: #facc15; border-radius: 50%; }
        .cal-day.today.holiday { color: white; } /* If today is holiday, keep white text */
        .cal-day.today.holiday::after { background: white; }

        /* Event Day */
        .cal-day.has-event { border: 1px solid #16a34a; color: #16a34a; background: rgba(22, 163, 74, 0.1); }
        .cal-day.has-event.today { border: none; background-color: #16a34a; color: white; }

        /* Countdown Box */
        .countdown-box span { 
            background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 6px; 
            font-family: monospace; font-weight: bold; color: #4ade80;
        }
    </style>
</head>
<body class="bg-brand-dark min-h-screen font-poppins text-slate-100 selection:bg-brand-green selection:text-white">

    <!-- HOME BUTTON -->
    <a href="../user/index.html" class="absolute top-6 left-6 z-50 w-12 h-12 bg-slate-900/50 backdrop-blur-md border border-white/10 rounded-xl flex items-center justify-center text-white hover:bg-brand-green hover:border-brand-green transition-all duration-300 shadow-lg group">
        <i class="ph-bold ph-house text-xl group-hover:scale-110 transition-transform"></i>
    </a>

    <div class="relative h-[40vh] w-full overflow-hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?q=80&w=2000')] bg-cover bg-center"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-brand-dark via-brand-dark/90 to-brand-dark/40"></div>
        
        <div class="relative z-10 text-center px-4" data-aos="fade-down">
            <h1 class="text-4xl md:text-6xl font-black text-white mb-2 uppercase tracking-tighter drop-shadow-2xl">
                Upcoming <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-green to-emerald-400">Events</span>
            </h1>
            <p class="text-slate-300 text-sm md:text-lg font-medium tracking-wide">Join us in our upcoming programs & activities.</p>
        </div>
    </div>

    <main class="max-w-7xl mx-auto px-4 md:px-6 -mt-20 relative z-20 pb-20 flex flex-col lg:flex-row gap-8">
        
        <!-- Left Column: Event Feed -->
        <!-- Removed 'order-2' to ensure it comes first on mobile naturally -->
        <div class="flex-1 space-y-6" id="eventFeed">
            <div class="text-center py-20 glass-card rounded-[2.5rem]">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-brand-green mx-auto mb-4"></div>
                <p class="text-slate-500 text-sm font-bold uppercase tracking-widest">Loading Events...</p>
            </div>
        </div>

        <!-- Right Column: Sidebar (Calendar) -->
        <!-- Removed 'order-first' so it stays below events on mobile, kept 'lg:order-last' for desktop right side -->
        <div class="w-full lg:w-80 shrink-0 space-y-6 lg:order-last">
            
            <!-- Calendar Widget -->
            <div class="glass-card rounded-[2rem] p-6 shadow-xl" data-aos="fade-left">
                <div class="flex justify-between items-center mb-6 border-b border-white/5 pb-4">
                    <h2 class="font-bold text-white text-lg tracking-tight" id="calDisplayMonth">January 2026</h2>
                    <div class="flex gap-1">
                        <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition"><i class="ph-bold ph-caret-left"></i></button>
                        <button onclick="changeMonth(1)" class="w-8 h-8 rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white flex items-center justify-center transition"><i class="ph-bold ph-caret-right"></i></button>
                    </div>
                </div>
                <div class="grid grid-cols-7 text-center mb-3 text-[10px] font-black text-slate-500 uppercase tracking-widest">
                    <div>Su</div><div>Mo</div><div>Tu</div><div>We</div><div>Th</div><div>Fr</div><div>Sa</div>
                </div>
                <div class="grid grid-cols-7 gap-y-2" id="calGrid"></div>
                
                <div class="mt-4 pt-4 border-t border-white/5 flex flex-wrap gap-3 justify-center text-[9px] font-bold text-slate-500 uppercase tracking-wider">
                    <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-brand-green"></span> Today</div>
                    <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-yellow-400"></span> Holiday</div>
                    <div class="flex items-center gap-1"><span class="w-2 h-2 rounded-full border border-brand-green"></span> Event</div>
                </div>
            </div>

            <!-- Special Days Widget -->
            <div class="glass-card rounded-[2rem] p-6 shadow-xl" data-aos="fade-left" data-aos-delay="100">
                <h3 class="text-xs font-black text-brand-green uppercase mb-4 tracking-widest flex items-center gap-2">
                    <i class="ph-fill ph-star"></i> Major Holidays
                </h3>
                <div class="space-y-3">
                    <div class="flex items-center gap-3 p-3 rounded-2xl bg-slate-800/50 hover:bg-slate-800 transition border border-white/5 group cursor-default">
                        <div class="bg-slate-700 text-white font-bold text-xs p-2.5 rounded-xl min-w-[40px] text-center shadow-lg group-hover:bg-slate-600 transition">01</div>
                        <span class="text-xs font-bold text-slate-300 uppercase tracking-wide">Jan - New Year</span>
                    </div>
                     <div class="flex items-center gap-3 p-3 rounded-2xl bg-yellow-900/10 hover:bg-yellow-900/20 transition border border-yellow-500/10 group cursor-default">
                        <div class="bg-yellow-600 text-white font-bold text-xs p-2.5 rounded-xl min-w-[40px] text-center shadow-lg shadow-yellow-500/20">04</div>
                        <span class="text-xs font-bold text-yellow-500 uppercase tracking-wide">Feb - Independence</span>
                    </div>
                    <div class="flex items-center gap-3 p-3 rounded-2xl bg-blue-900/10 hover:bg-blue-900/20 transition border border-blue-500/10 group cursor-default">
                        <div class="bg-blue-600 text-white font-bold text-xs p-2.5 rounded-xl min-w-[40px] text-center shadow-lg shadow-blue-500/20">14</div>
                        <span class="text-xs font-bold text-blue-400 uppercase tracking-wide">Apr - New Year</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script>
        AOS.init();

        // --- CALENDAR LOGIC ---
        let currDate = new Date();
        let currYear = currDate.getFullYear();
        let currMonth = currDate.getMonth();
        let fetchedEvents = [];

        // Fixed Holidays (MM-DD) - Recurring every year
        const fixedHolidays = {
            "01-01": "New Year",
            "01-14": "Thai Pongal",
            "02-04": "Independence Day",
            "04-13": "New Year Eve",
            "04-14": "Sinhala Tamil New Year",
            "05-01": "May Day",
            "12-25": "Christmas"
        };

        // Specific Poya & Special Dates (YYYY-MM-DD)
        const specificHolidays = {
            // 2025
            "2025-01-13": "Duruthu Poya", "2025-02-12": "Navam Poya", "2025-03-13": "Medin Poya",
            "2025-04-12": "Bak Poya", "2025-05-12": "Vesak Poya", "2025-06-10": "Poson Poya",
            "2025-07-10": "Esala Poya", "2025-08-08": "Nikini Poya", "2025-09-07": "Binara Poya",
            "2025-10-06": "Vap Poya", "2025-11-05": "Il Poya", "2025-12-04": "Unduvap Poya",
            // 2026
            "2026-01-03": "Duruthu Poya", "2026-02-01": "Navam Poya", "2026-03-02": "Medin Poya",
            "2026-04-01": "Bak Poya", "2026-05-01": "Vesak Poya", "2026-05-30": "Adhi Poson",
            "2026-06-29": "Poson Poya", "2026-07-28": "Esala Poya", "2026-08-27": "Nikini Poya",
            "2026-09-25": "Binara Poya", "2026-10-24": "Vap Poya", "2026-11-23": "Il Poya",
            "2026-12-23": "Unduvap Poya"
        };

        function generateCalendar(year, month) {
            const calGrid = document.getElementById('calGrid');
            const calMonth = document.getElementById('calDisplayMonth');
            
            // Limit year to 2028
            if (year > 2028) { currYear = 2028; year = 2028; }
            if (year < 2024) { currYear = 2024; year = 2024; }

            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            calMonth.innerText = `${monthNames[month]} ${year}`;
            calGrid.innerHTML = "";

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const today = new Date();

            // Previous Month Fillers
            for (let i = 0; i < firstDay; i++) {
                calGrid.innerHTML += `<div></div>`;
            }

            // Days
            for (let day = 1; day <= daysInMonth; day++) {
                let classes = "cal-day";
                const dateKey = `${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; // MM-DD
                const fullDateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`; // YYYY-MM-DD

                // Check Today
                if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                    classes += " today";
                }

                // Check Holiday (Fixed OR Specific)
                if (fixedHolidays[dateKey] || specificHolidays[fullDateKey]) {
                    classes += " holiday";
                }

                // Check Event
                const hasEvent = fetchedEvents.some(e => e.event_date === fullDateKey);
                if (hasEvent) {
                    classes += " has-event";
                }

                const holidayName = fixedHolidays[dateKey] || specificHolidays[fullDateKey] || '';
                calGrid.innerHTML += `<div class="${classes}" title="${holidayName}">${day}</div>`;
            }
        }

        function changeMonth(dir) {
            currMonth += dir;
            if (currMonth > 11) { currMonth = 0; currYear++; }
            if (currMonth < 0) { currMonth = 11; currYear--; }
            generateCalendar(currYear, currMonth);
        }

        // --- EVENT & COUNTDOWN LOGIC ---
        async function loadEvents() {
            const { data } = await _supabase
                .from('events')
                .select('*')
                .eq('is_hidden', false)
                .order('event_date', { ascending: true });

            fetchedEvents = data || [];
            generateCalendar(currYear, currMonth); // Update calendar with events

            const feed = document.getElementById('eventFeed');
            feed.innerHTML = '';

            if(!data || data.length === 0) {
                 feed.innerHTML = `
                    <div class="glass-card p-12 rounded-[2.5rem] text-center">
                        <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center text-slate-500 text-4xl mx-auto mb-4 border border-white/5">
                            <i class="ph-duotone ph-calendar-slash"></i>
                        </div>
                        <h3 class="text-xl font-bold text-white">No Upcoming Events</h3>
                        <p class="text-slate-400 text-sm mt-1">Check back later for updates.</p>
                    </div>`;
                 return;
            }

            data.forEach((ev, i) => {
                const dateObj = new Date(ev.event_date);
                const month = dateObj.toLocaleString('default', { month: 'short' }).toUpperCase();
                const day = dateObj.getDate();
                const eventTarget = new Date(`${ev.event_date}T${ev.event_time || '00:00:00'}`);
                const uniqueId = `timer-${i}`;

                // Responsive Layout
                feed.innerHTML += `
                <div class="glass-card rounded-[2.5rem] p-6 md:p-8 flex flex-col md:flex-row gap-6 md:gap-8 items-start group hover:-translate-y-1 transition-all duration-300 relative overflow-hidden" data-aos="fade-up" data-aos-delay="${i*100}">
                    
                    <!-- Glow -->
                    <div class="absolute top-0 right-0 w-32 h-32 bg-brand-green/10 rounded-full blur-[60px] -z-10 group-hover:bg-brand-green/20 transition duration-500"></div>

                    <!-- Date Box -->
                    <div class="shrink-0 w-full md:w-auto flex md:block items-center gap-3 bg-slate-900/80 border border-white/10 rounded-2xl p-4 text-center min-w-[90px] shadow-lg z-10">
                        <span class="text-xs font-bold text-brand-green uppercase tracking-wider md:block">${month}</span>
                        <div class="h-4 w-px bg-white/10 md:hidden"></div>
                        <span class="text-2xl md:text-4xl font-black text-white md:block md:mt-1">${day}</span>
                    </div>

                    <!-- Content -->
                    <div class="flex-1 w-full relative z-10">
                        <h2 class="text-xl md:text-2xl font-black text-white mb-2 leading-tight group-hover:text-brand-green transition">${ev.title}</h2>
                        <p class="text-sm text-slate-400 mb-6 leading-relaxed font-light line-clamp-3">${ev.description || 'Join us for this special event.'}</p>
                        
                        <div class="flex flex-wrap gap-3 mb-6">
                             <span class="bg-slate-900/50 px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider text-slate-300 border border-white/10 flex items-center gap-2">
                                <i class="ph-bold ph-clock text-brand-green"></i> ${ev.event_time ? ev.event_time.slice(0,5) : 'TBA'}
                             </span>
                             <span class="bg-slate-900/50 px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase tracking-wider text-slate-300 border border-white/10 flex items-center gap-2">
                                <i class="ph-fill ph-map-pin text-red-500"></i> ${ev.location || 'Horana'}
                             </span>
                        </div>

                        <!-- COUNTDOWN SECTION (Responsive Dropdown) -->
                        <div class="w-full">
                            <!-- Desktop View -->
                            <div class="hidden lg:block bg-slate-900/50 rounded-xl p-3 border border-white/5">
                                <p class="text-[10px] text-slate-500 uppercase font-bold mb-2 text-center tracking-widest">Time Remaining</p>
                                <div class="flex justify-center gap-3 text-xs countdown-box" id="${uniqueId}-desk">
                                    <span>00d</span> : <span>00h</span> : <span>00m</span> : <span>00s</span>
                                </div>
                            </div>

                            <!-- Mobile View (Dropdown Details) -->
                            <details class="lg:hidden group/details">
                                <summary class="list-none cursor-pointer bg-slate-800 hover:bg-slate-700 border border-white/5 rounded-xl p-3 text-center text-xs font-bold text-brand-green uppercase tracking-wider transition">
                                    <span class="group-open/details:hidden flex items-center justify-center gap-2"><i class="ph-bold ph-timer"></i> Show Timer</span>
                                    <span class="hidden group-open/details:flex items-center justify-center gap-2"><i class="ph-bold ph-x"></i> Hide Timer</span>
                                </summary>
                                <div class="mt-2 bg-slate-900/80 rounded-xl p-4 border border-white/5 text-center countdown-box" id="${uniqueId}-mob">
                                    <div class="flex justify-center gap-2 text-sm">
                                        <span>00d</span> : <span>00h</span> : <span>00m</span> : <span>00s</span>
                                    </div>
                                </div>
                            </details>
                        </div>
                    </div>

                    <!-- Image -->
                    <div class="w-full md:w-48 h-48 md:h-32 rounded-2xl overflow-hidden shrink-0 bg-slate-900 relative z-10 border border-white/10 shadow-lg order-first md:order-last">
                        <img src="${ev.image_url || 'https://via.placeholder.com/300/16a34a/ffffff?text=DMYSC'}" class="w-full h-full object-cover group-hover:scale-110 transition duration-700 opacity-90 group-hover:opacity-100">
                    </div>
                </div>`;

                // Start Timer
                startCountdown(eventTarget, uniqueId);
            });
        }

        function startCountdown(targetDate, idBase) {
            const updateTimer = () => {
                const now = new Date().getTime();
                const distance = targetDate - now;

                if (distance < 0) {
                    const expiredMsg = '<span class="text-red-500 font-bold">Event Started/Ended</span>';
                    const elDesk = document.getElementById(`${idBase}-desk`);
                    const elMob = document.getElementById(`${idBase}-mob`);
                    if(elDesk) elDesk.innerHTML = expiredMsg;
                    if(elMob && elMob.querySelector('div')) elMob.querySelector('div').innerHTML = expiredMsg;
                    return;
                }

                const days = Math.floor(distance / (1000 * 60 * 60 * 24));
                const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((distance % (1000 * 60)) / 1000);

                const html = `<span>${days}d</span> : <span>${hours}h</span> : <span>${minutes}m</span> : <span>${seconds}s</span>`;
                
                const elDesk = document.getElementById(`${idBase}-desk`);
                const elMob = document.getElementById(`${idBase}-mob`);
                
                if(elDesk) elDesk.innerHTML = html;
                if(elMob && elMob.querySelector('div')) elMob.querySelector('div').innerHTML = html;
            };

            updateTimer(); // run immediately
            setInterval(updateTimer, 1000);
        }

        loadEvents();
    </script>
    <div id="global-footer-placeholder"></div>
    <script src="js/footer-loader.js"></script>
    <script>
        document.getElementById('year').innerText = new Date().getFullYear();
    </script>
</body>
</html>
