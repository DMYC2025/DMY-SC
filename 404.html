<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | DMYSC</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        background: '#121212',
                        surface: '#1E1E1E',
                        primary: '#a6f7bd',
                    },
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                        display: ['Outfit', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Roboto:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
</head>

<body class="bg-background text-[#E3E3E3] font-sans h-screen flex items-center justify-center overflow-hidden">

    <!-- Background Elements -->
    <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-[600px] h-[600px] bg-primary opacity-5 rounded-full blur-[120px]">
        </div>
        <div
            class="absolute bottom-[-10%] right-[-10%] w-[600px] h-[600px] bg-primary opacity-5 rounded-full blur-[120px]">
        </div>
    </div>

    <div class="text-center px-4">
        <h1 class="text-9xl font-display font-bold text-primary mb-4 opacity-20">404</h1>
        <div class="relative -mt-24 mb-8">
            <span class="material-symbols-rounded text-8xl text-primary animate-bounce">running_with_errors</span>
        </div>
        <h2 class="text-3xl md:text-5xl font-display font-bold mb-4">Lost in the Field?</h2>
        <p class="text-[#C4C7C5] max-w-md mx-auto mb-10 leading-relaxed font-light">
            The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.
        </p>

        <div class="flex flex-col md:flex-row gap-4 justify-center items-center">
            <a href="index.html"
                class="px-8 py-3 rounded-full bg-primary text-[#003915] font-bold hover:bg-[#b1fcc5] transition-all flex items-center gap-2 group">
                <span
                    class="material-symbols-rounded translate-x-0 group-hover:-translate-x-1 transition-transform">arrow_back</span>
                Back to Home
            </a>
            <a href="auth/login.html"
                class="px-8 py-3 rounded-full bg-[#1E1E1E] border border-white/10 text-white font-bold hover:bg-white/5 transition-all flex items-center gap-2">
                <span class="material-symbols-rounded">login</span>
                Member Login
            </a>
        </div>
    </div>

</body>

</html>
