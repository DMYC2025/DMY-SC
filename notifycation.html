<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - DMYSC</title>
    <link rel="icon" type="image/png" href="../assets/logo_1.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { brand: { green: '#16a34a', dark: '#0b1121' } },
                    fontFamily: { poppins: ['Poppins', 'sans-serif'] } 
                } 
            } 
        }
    </script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        .glass-card {
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-brand-dark min-h-screen font-poppins text-slate-100 selection:bg-brand-green selection:text-white">

    <!-- HOME BUTTON -->
    <a href="../user/index.html" class="absolute top-6 left-6 z-50 w-12 h-12 bg-slate-900/50 backdrop-blur-md border border-white/10 rounded-xl flex items-center justify-center text-white hover:bg-brand-green hover:border-brand-green transition-all duration-300 shadow-lg group">
        <i class="ph-bold ph-house text-xl group-hover:scale-110 transition-transform"></i>
    </a>

    <div class="relative h-[40vh] w-full overflow-hidden flex items-center justify-center">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1579548122080-c35fd6820ecb?q=80&w=2070')] bg-cover bg-center"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-brand-dark via-brand-dark/90 to-brand-dark/50"></div>
        
        <div class="relative z-10 text-center px-4" data-aos="fade-down">
            <h1 class="text-4xl md:text-6xl font-black text-white mb-2 uppercase tracking-tighter">
                Club <span class="text-transparent bg-clip-text bg-gradient-to-r from-brand-green to-yellow-400">Alerts</span>
            </h1>
            <p class="text-slate-300 text-sm md:text-lg font-medium tracking-wide">Stay updated with the latest news and announcements.</p>
        </div>
    </div>

    <main class="max-w-4xl mx-auto px-4 md:px-6 -mt-20 relative z-20 pb-20">
        <div id="notificationFeed" class="space-y-4 md:space-y-6">
            <div class="text-center py-20 glass-card rounded-[2.5rem]">
                <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-brand-green mx-auto mb-4"></div>
                <p class="text-slate-500 text-sm font-bold uppercase tracking-widest">Loading Notifications...</p>
            </div>
        </div>
    </main>

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script src="js/supabase.js"></script>
    <script src="js/ui.js"></script>
    <script>
        AOS.init();

        async function fetchNotifications() {
            const { data, error } = await _supabase
                .from('notifications')
                .select('*')
                .order('created_at', { ascending: false });

            const feed = document.getElementById('notificationFeed');
            feed.innerHTML = '';

            if (!data || data.length === 0) {
                feed.innerHTML = `
                    <div class="glass-card p-12 rounded-[2.5rem] text-center">
                        <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center text-slate-500 text-4xl mx-auto mb-4 border border-white/5">
                            <i class="ph-duotone ph-bell-slash"></i>
                        </div>
                        <h3 class="text-xl font-bold text-white">No New Alerts</h3>
                        <p class="text-slate-400 text-sm mt-1">You are all caught up!</p>
                    </div>
                `;
                return;
            }

            data.forEach((n, index) => {
                const isUrgent = n.priority === 'urgent';
                
                // Styling based on priority
                // Using glass-card base but adding specific tints for urgent
                const cardClasses = isUrgent 
                    ? 'glass-card bg-red-900/20 border-red-500/30 shadow-[0_0_30px_rgba(239,68,68,0.1)]' 
                    : 'glass-card';
                
                const iconBg = isUrgent ? 'bg-red-500 text-white' : 'bg-brand-green text-white';
                const icon = isUrgent ? 'ph-warning-circle' : 'ph-info';
                
                const dateObj = new Date(n.created_at);
                const date = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: '2-digit', minute:'2-digit' });

                const item = `
                    <div class="${cardClasses} p-6 rounded-[2rem] hover:-translate-y-1 transition duration-300 relative overflow-hidden group" data-aos="fade-up" data-aos-delay="${index * 100}">
                        
                        ${isUrgent ? `
                        <div class="absolute top-0 right-0 bg-red-600 text-white text-[9px] font-black uppercase px-4 py-1.5 rounded-bl-2xl shadow-lg z-20 flex items-center gap-1">
                            <i class="ph-bold ph-siren"></i> Urgent
                        </div>` : ''}
                        
                        <div class="flex gap-5 items-start relative z-10">
                            <div class="shrink-0">
                                <div class="w-12 h-12 md:w-14 md:h-14 rounded-2xl ${iconBg} flex items-center justify-center shadow-lg shadow-black/20">
                                    <i class="ph-fill ${icon} text-xl md:text-2xl"></i>
                                </div>
                            </div>
                            <div class="flex-1 pt-1">
                                <h3 class="text-lg md:text-xl font-black text-white mb-2 leading-tight pr-12">${n.title}</h3>
                                <p class="text-slate-300 text-sm leading-relaxed mb-4 font-light">${n.message}</p>
                                <div class="flex items-center gap-2 text-[10px] md:text-xs font-bold text-slate-500 uppercase tracking-widest">
                                    <i class="ph-bold ph-clock"></i> ${date}
                                </div>
                            </div>
                        </div>
                        
                        <!-- Glow Effect -->
                        <div class="absolute -bottom-10 -right-10 w-32 h-32 ${isUrgent ? 'bg-red-500/10' : 'bg-brand-green/10'} rounded-full blur-[60px] group-hover:blur-[80px] transition duration-500"></div>
                    </div>
                `;
                feed.insertAdjacentHTML('beforeend', item);
            });
        }

        fetchNotifications();
    </script>
    <div id="global-footer-placeholder"></div>
    <script src="js/footer-loader.js"></script>
    <script>
        document.getElementById('year').innerText = new Date().getFullYear();
    </script>
</body>
</html>
