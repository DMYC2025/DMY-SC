<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMYC Official Launch</title>
    <link rel="icon" type="image/png" href="assets/logo_1.png">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class', 
            theme: { 
                extend: { 
                    colors: { 
                        brand: { 
                            green: '#16a34a', 
                            neon: '#00ff41',
                            dark: '#050914',
                            cyber: '#0ff'
                        } 
                    },
                    fontFamily: { 
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif']
                    },
                    backgroundImage: {
                        'grid-pattern': "linear-gradient(to right, #16a34a1a 1px, transparent 1px), linear-gradient(to bottom, #16a34a1a 1px, transparent 1px)"
                    }
                } 
            } 
        }
    </script>

    <!-- GSAP for Cinematic Timeline -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/TextPlugin.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            background-color: #050914;
            overflow: hidden;
            font-family: 'Rajdhani', sans-serif;
        }

        /* 3D Perspective Container */
        .scene {
            perspective: 1000px;
            transform-style: preserve-3d;
        }

        /* Glitch Text Effect */
        .glitch-wrapper {
            position: relative;
        }
        .glitch-wrapper::before, .glitch-wrapper::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .glitch-wrapper::before {
            left: 2px;
            text-shadow: -1px 0 #ff00c1;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim-1 5s infinite linear alternate-reverse;
        }
        .glitch-wrapper::after {
            left: -2px;
            text-shadow: -1px 0 #00fff9;
            clip: rect(44px, 450px, 56px, 0);
            animation: glitch-anim-2 5s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip: rect(20px, 9999px, 80px, 0); }
            20% { clip: rect(60px, 9999px, 10px, 0); }
            40% { clip: rect(40px, 9999px, 90px, 0); }
            60% { clip: rect(80px, 9999px, 20px, 0); }
            80% { clip: rect(10px, 9999px, 60px, 0); }
            100% { clip: rect(50px, 9999px, 30px, 0); }
        }
        @keyframes glitch-anim-2 {
            0% { clip: rect(60px, 9999px, 10px, 0); }
            20% { clip: rect(30px, 9999px, 70px, 0); }
            40% { clip: rect(90px, 9999px, 40px, 0); }
            60% { clip: rect(10px, 9999px, 80px, 0); }
            80% { clip: rect(50px, 9999px, 20px, 0); }
            100% { clip: rect(70px, 9999px, 30px, 0); }
        }

        /* Button Hover Scan */
        .btn-scan {
            position: relative;
            overflow: hidden;
        }
        .btn-scan::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            transition: 0.5s;
        }
        .btn-scan:hover::after {
            left: 100%;
            transition: 0.5s;
        }

        /* Loader Bar */
        .loader-bar {
            width: 0%;
            height: 2px;
            background: #16a34a;
            box-shadow: 0 0 10px #16a34a;
        }

        /* Countdown Number Style */
        .countdown-text {
            text-shadow: 0 0 40px rgba(22, 163, 74, 0.8);
        }
    </style>
</head>
<body class="h-screen w-screen text-white select-none">

    <!-- CANVAS STARFIELD BACKGROUND (Vanilla JS) -->
    <canvas id="warpCanvas" class="fixed inset-0 z-0 opacity-40"></canvas>

    <!-- UI LAYER -->
    <div class="relative z-10 w-full h-full flex flex-col items-center justify-center p-6">
        
        <!-- INTRO LOADER (Sequence 1) -->
        <div id="intro-sequence" class="absolute inset-0 z-50 bg-brand-dark flex flex-col items-center justify-center">
            <div class="font-mono text-brand-neon text-xs mb-2 tracking-widest" id="loader-text">INITIALIZING CORE SYSTEMS...</div>
            <div class="w-64 h-1 bg-gray-800 rounded-full overflow-hidden">
                <div id="progress-bar" class="loader-bar"></div>
            </div>
            <div class="mt-4 font-orbitron text-4xl font-bold tracking-tighter" id="percent-text">0%</div>
        </div>

        <!-- MAIN CONTENT (Sequence 2) -->
        <div id="main-content" class="text-center opacity-0 scale-95 transform transition-all duration-700 scene">
            
            <!-- Floating Elements -->
            <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[500px] h-[500px] border border-brand-green/10 rounded-full animate-[spin_10s_linear_infinite] pointer-events-none"></div>
            <div class="absolute -top-32 left-1/2 -translate-x-1/2 w-[400px] h-[400px] border border-dashed border-brand-green/20 rounded-full animate-[spin_15s_linear_infinite_reverse] pointer-events-none"></div>

            <!-- Logo with 3D Pop -->
            <div class="relative group perspective-1000 mb-8">
                <div class="absolute inset-0 bg-brand-green/20 blur-3xl rounded-full opacity-0 group-hover:opacity-100 transition duration-1000"></div>
                <img src="assets/logo_2.png" alt="DMYSC" class="w-32 md:w-48 mx-auto relative z-10 drop-shadow-[0_0_15px_rgba(22,163,74,0.5)]">
            </div>

            <!-- Glitch Title -->
            <div class="space-y-2 mb-10">
                <h2 class="text-brand-green tracking-[0.5em] text-sm md:text-base font-bold uppercase opacity-80">Official Launch</h2>
                <h1 class="text-5xl md:text-8xl font-black font-orbitron text-white glitch-wrapper" data-text="DMYSC 2025">
                    DMYSC
                </h1>
                <p class="text-slate-400 text-lg md:text-2xl font-light tracking-wide max-w-2xl mx-auto mt-4" id="typing-text">
                    <!-- Typing effect here -->
                </p>
            </div>

            <!-- Interactive Launch Button -->
            <button id="launchBtn" class="btn-scan group relative inline-flex items-center gap-4 px-10 py-5 bg-brand-dark border border-brand-green/50 text-brand-green font-orbitron font-bold text-xl tracking-widest uppercase rounded-sm hover:bg-brand-green hover:text-white transition-all duration-300 shadow-[0_0_20px_rgba(22,163,74,0.2)] hover:shadow-[0_0_40px_rgba(22,163,74,0.6)]">
                <i class="ph-bold ph-power text-2xl"></i>
                <span>Initialize Site</span>
                <div class="absolute inset-0 border border-white/10 scale-105 opacity-0 group-hover:opacity-100 group-hover:scale-100 transition duration-500"></div>
            </button>
            
            <div class="mt-8 grid grid-cols-3 gap-8 text-[10px] md:text-xs text-slate-600 font-mono tracking-widest uppercase">
                <div>
                    <span class="block text-brand-green mb-1">Status</span>
                    <span class="animate-pulse">Online</span>
                </div>
                <div>
                    <span class="block text-brand-green mb-1">Version</span>
                    <span>v2.5.0</span>
                </div>
                <div>
                    <span class="block text-brand-green mb-1">Security</span>
                    <span>Encrypted</span>
                </div>
            </div>
        </div>

        <!-- COUNTDOWN OVERLAY (Hidden by default) -->
        <div id="countdown-overlay" class="fixed inset-0 z-40 flex items-center justify-center pointer-events-none hidden">
            <div id="countdown-number" class="text-[12rem] md:text-[25rem] font-black font-orbitron text-white glitch-wrapper countdown-text" data-text=""></div>
        </div>

    </div>

    <!-- White Flash Overlay for Transition -->
    <div id="flash-overlay" class="fixed inset-0 bg-white z-[100] pointer-events-none opacity-0"></div>

    <script>
        // --- 1. VANILLA JS: STARFIELD / WARP DRIVE EFFECT ---
        const canvas = document.getElementById('warpCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        let stars = [];
        let speed = 2; // Normal speed
        let warpActive = false;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width;
            canvas.height = height;
        }
        window.addEventListener('resize', resize);
        resize();

        class Star {
            constructor() {
                this.x = (Math.random() - 0.5) * width * 2; // Spread wider
                this.y = (Math.random() - 0.5) * height * 2;
                this.z = Math.random() * width;
                this.pz = this.z; // Previous z for streak effect
            }

            update() {
                this.z = this.z - speed;
                if (this.z <= 0) {
                    this.z = width;
                    this.x = (Math.random() - 0.5) * width * 2;
                    this.y = (Math.random() - 0.5) * height * 2;
                    this.pz = this.z;
                }
            }

            draw() {
                let x = (this.x / this.z) * width + width / 2;
                let y = (this.y / this.z) * height + height / 2;

                // Scale based on depth
                let radius = (1 - this.z / width) * (warpActive ? 4 : 2);

                // Previous position for streak
                let px = (this.x / this.pz) * width + width / 2;
                let py = (this.y / this.pz) * height + height / 2;

                this.pz = this.z;

                ctx.beginPath();
                ctx.moveTo(px, py);
                ctx.lineTo(x, y);
                
                if (warpActive) {
                    // Streak style
                    ctx.strokeStyle = `rgba(22, 163, 74, ${1 - this.z/width})`;
                    ctx.lineWidth = radius;
                    ctx.stroke();
                } else {
                    // Dot style
                    ctx.fillStyle = `rgba(255, 255, 255, ${1 - this.z/width})`;
                    ctx.arc(x, y, radius, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        }

        // Initialize Stars
        for (let i = 0; i < 800; i++) {
            stars.push(new Star());
        }

        function animateStars() {
            // Clear with trail effect
            ctx.fillStyle = warpActive ? 'rgba(5, 9, 20, 0.3)' : 'rgba(5, 9, 20, 1)';
            ctx.fillRect(0, 0, width, height);

            for (let star of stars) {
                star.update();
                star.draw();
            }
            requestAnimationFrame(animateStars);
        }
        animateStars();

        // --- 2. GSAP: CINEMATIC TIMELINE ---
        document.addEventListener('DOMContentLoaded', () => {
            gsap.registerPlugin(TextPlugin);
            
            const tl = gsap.timeline();

            // Sequence 1: Loader
            const progressBar = document.getElementById('progress-bar');
            const percentText = document.getElementById('percent-text');
            const loaderText = document.getElementById('loader-text');
            const introDiv = document.getElementById('intro-sequence');
            const mainContent = document.getElementById('main-content');

            // Simulate Loading
            let progress = { value: 0 };
            tl.to(progress, {
                value: 100,
                duration: 2.5,
                ease: "power2.inOut",
                onUpdate: () => {
                    progressBar.style.width = `${progress.value}%`;
                    percentText.innerText = `${Math.round(progress.value)}%`;
                    
                    if(progress.value > 30) loaderText.innerText = "LOADING ASSETS...";
                    if(progress.value > 60) loaderText.innerText = "ESTABLISHING UPLINK...";
                    if(progress.value > 90) loaderText.innerText = "SYSTEM READY.";
                }
            })
            .to(introDiv, {
                duration: 0.5,
                opacity: 0,
                display: "none",
                ease: "power2.in"
            })
            // Sequence 2: Main Reveal
            .to(mainContent, {
                duration: 1,
                opacity: 1,
                scale: 1,
                ease: "back.out(1.2)"
            })
            .to("#typing-text", {
                duration: 2,
                text: "Dream Makers Youth & Sports Club",
                ease: "none"
            });

            // --- 3. COUNTDOWN & LAUNCH LOGIC ---
            const btn = document.getElementById('launchBtn');
            const flash = document.getElementById('flash-overlay');
            const countdownOverlay = document.getElementById('countdown-overlay');
            const countdownNumber = document.getElementById('countdown-number');

            btn.addEventListener('click', () => {
                // A. Prevent double clicks
                btn.style.pointerEvents = 'none';

                // B. Disintegrate Main UI
                gsap.to(mainContent, {
                    duration: 0.8,
                    scale: 1.5,
                    opacity: 0,
                    filter: "blur(20px)",
                    ease: "power2.in"
                });

                // C. Start Countdown Sequence
                countdownOverlay.classList.remove('hidden');
                
                const countTl = gsap.timeline({
                    onComplete: triggerFinalLaunch
                });

                // Define Countdown Numbers
                const numbers = ['3', '2', '1'];

                numbers.forEach((num, index) => {
                    countTl.add(() => {
                        // Update text
                        countdownNumber.innerText = num;
                        countdownNumber.setAttribute('data-text', num);
                        // Increase Warp Speed progressively
                        warpActive = true;
                        gsap.to(window, { duration: 0.5, onUpdate: () => { speed = (index + 1) * 15; } });
                        
                        // Confetti per number for hype
                        confetti({
                            particleCount: 30,
                            spread: 50,
                            origin: { y: 0.7 },
                            colors: ['#16a34a']
                        });
                    })
                    // Animate In (Zoom & Rotate)
                    .fromTo(countdownNumber, 
                        { scale: 0.2, opacity: 0, rotation: -15 },
                        { scale: 1, opacity: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }
                    )
                    // Shake/Glitch
                    .to(countdownNumber, { 
                        x: 10, duration: 0.05, repeat: 3, yoyo: true 
                    })
                    // Animate Out (Zoom into camera)
                    .to(countdownNumber, {
                        scale: 3, opacity: 0, duration: 0.3, ease: "power2.in"
                    });
                });
            });

            function triggerFinalLaunch() {
                // Max Speed
                speed = 50;

                // Final Big Confetti
                confetti({
                    particleCount: 200,
                    spread: 160,
                    origin: { y: 0.6 },
                    colors: ['#16a34a', '#00ff41', '#ffffff']
                });

                // White Flash & Redirect
                gsap.to(flash, {
                    duration: 0.5, // slightly longer flash for dramatic effect
                    opacity: 1,
                    delay: 0.2,
                    ease: "power2.in",
                    onComplete: () => {
                        window.location.href = "index.html";
                    }
                });
            }
        });
    </script>
</body>
</html>
